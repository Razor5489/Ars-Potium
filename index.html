<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" href="favicon.png?v=5">
<link rel="apple-touch-icon" href="favicon.png?v=5">
<title>Ars Potionum · Manuale di Pozioni</title>
<meta name="robots" content="noarchive">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071811}
#book{display:block;width:100%;height:100%;border:0}
#scholar-presence{display:none!important}
@media print{html,body,#book,#scholar-presence{display:none!important}}
</style>
</head>
<body>
<iframe id="book" src="viewer/ars-potionum-viewer.html?v=20261019-paper4-volume20" title="Ars Potionum" allow="fullscreen" allowfullscreen></iframe>

<div id="scholar-presence" aria-live="polite">
  <span class="presence-dot" aria-hidden="true"></span>
  <span id="scholar-presence-text">0 studiosi online</span>
</div>

<script>
(() => {
  const frame = document.getElementById('book');
  const blockedShortcut = (e) => {
    const k = String(e.key || '').toLowerCase();
    const cmd = e.ctrlKey || e.metaKey;
    if (
      (cmd && ['s','u','p'].includes(k)) ||
      (cmd && e.shiftKey && ['i','j','c'].includes(k)) ||
      k === 'f12'
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  };

  const installInlinePresence = (viewerDoc) => {
    try {
      const inner = viewerDoc.getElementById('content');
      if (!inner) return;

      const install = () => {
        try {
          const d = inner.contentDocument;
          if (!d || !d.body || d.getElementById('scholar-presence-inline')) return;

          const normalize = value => String(value || '').replace(/\s+/g, ' ').trim();
          let tabula = d.getElementById('chapters');
          if (!tabula) {
            const nodes = Array.from(d.querySelectorAll('select,button,[role="button"],[role="combobox"],div,span'));
            tabula = nodes.find(el => normalize(el.textContent).includes('Tabula Materiarum'));
          }
          if (!tabula || !tabula.parentNode) return;

          const badge = d.createElement('span');
          badge.id = 'scholar-presence-inline';
          badge.setAttribute('aria-live', 'polite');
          badge.style.cssText = [
            'display:inline-flex',
            'align-items:center',
            'justify-content:center',
            'gap:6px',
            'flex:0 0 auto',
            'box-sizing:border-box',
            'min-height:38px',
            'padding:7px 10px',
            'margin-right:8px',
            'border:1px solid rgba(190,155,80,.55)',
            'border-radius:6px',
            'background:rgba(8,35,26,.72)',
            'color:#e8dfbf',
            'font:italic 11px/1.2 Georgia,"Times New Roman",serif',
            'white-space:nowrap',
            'pointer-events:none',
            'user-select:none',
            'vertical-align:middle'
          ].join(';');

          const dot = d.createElement('span');
          dot.setAttribute('aria-hidden','true');
          dot.style.cssText = 'width:5px;height:5px;border-radius:50%;background:#9bae7b;box-shadow:0 0 5px rgba(155,174,123,.35);flex:0 0 auto';

          const text = d.createElement('span');
          text.id = 'scholar-presence-inline-text';
          const fallback = document.getElementById('scholar-presence-text');
          text.textContent = fallback ? fallback.textContent : '0 studiosi online';

          badge.append(dot, text);
          tabula.parentNode.insertBefore(badge, tabula);

          const fitToolbar = () => {
            try {
              const vw = d.documentElement.clientWidth || inner.clientWidth || 0;
              if (vw < 760) {
                badge.style.minHeight = '32px';
                badge.style.padding = '5px 7px';
                badge.style.fontSize = '9px';
                badge.style.marginRight = '5px';
              }

              const parent = tabula.parentElement;
              if (!parent || vw < 760) return;
              const children = Array.from(parent.children).filter(el => {
                const s = d.defaultView.getComputedStyle(el);
                return s.display !== 'none' && s.position !== 'absolute' && s.position !== 'fixed';
              });
              const rightEdge = Math.max(...children.map(el => el.getBoundingClientRect().right));
              const overflow = rightEdge - (vw - 10);
              const rect = tabula.getBoundingClientRect();
              if (overflow > 0 && rect.width > 220) {
                const width = Math.max(220, Math.floor(rect.width - overflow - 8));
                tabula.style.width = width + 'px';
                tabula.style.maxWidth = width + 'px';
                tabula.style.minWidth = '0';
                tabula.style.flex = '0 1 ' + width + 'px';
                tabula.style.whiteSpace = 'nowrap';
                tabula.style.overflow = 'hidden';
                tabula.style.textOverflow = 'ellipsis';
              }
            } catch (_) {}
          };

          d.defaultView.requestAnimationFrame(fitToolbar);
          d.defaultView.addEventListener('resize', fitToolbar, {passive:true});
        } catch (_) {}
      };

      if (!inner.__arsPresenceBound) {
        inner.__arsPresenceBound = true;
        inner.addEventListener('load', install);
      }
      install();
      window.setTimeout(install, 300);
      window.setTimeout(install, 1200);
    } catch (_) {}
  };

  const protect = () => {
    try {
      const d = frame.contentDocument;
      const w = frame.contentWindow;
      if (!d || !w) return;

      installInlinePresence(d);

      const download = d.getElementById('download');
      if (download) download.remove();

      const style = d.createElement('style');
      style.textContent = `
        img{-webkit-user-drag:none!important;user-drag:none!important}
        @media print{html,body{display:none!important}}
      `;
      d.head.appendChild(style);

      d.addEventListener('contextmenu', e => e.preventDefault(), true);
      d.addEventListener('dragstart', e => e.preventDefault(), true);
      d.addEventListener('selectstart', e => e.preventDefault(), true);
      d.addEventListener('copy', e => e.preventDefault(), true);
      d.addEventListener('cut', e => e.preventDefault(), true);
      d.addEventListener('keydown', blockedShortcut, true);
      w.addEventListener('keydown', blockedShortcut, true);
    } catch (_) {}
  };

  frame.addEventListener('load', protect);
  document.addEventListener('contextmenu', e => e.preventDefault(), true);
  document.addEventListener('dragstart', e => e.preventDefault(), true);
  document.addEventListener('keydown', blockedShortcut, true);
})();

(() => {
  const label = document.getElementById('scholar-presence-text');
  if (!label) return;

  const API = 'https://abacus.jasoncameron.dev';
  const NAMESPACE = 'ars-potionum-razor5489-presence-9f3b2c7a';
  const MARKER = 'arsPotionumPresenceMinuteV2';
  let syncing = false;

  const render = (count) => {
    const n = Math.max(0, Number(count) || 0);
    const text = n === 1 ? '1 studioso online' : `${n} studiosi online`;
    label.textContent = text;
    try {
      const outer = document.getElementById('book');
      const viewerDoc = outer && outer.contentDocument;
      const inner = viewerDoc && viewerDoc.getElementById('content');
      const bookDoc = inner && inner.contentDocument;
      const inline = bookDoc && bookDoc.getElementById('scholar-presence-inline-text');
      if (inline) inline.textContent = text;
    } catch (_) {}
  };

  const minuteId = () => String(Math.floor(Date.now() / 60000));
  const counterKey = (minute) => `online-${minute}`;

  const readCounter = async (minute) => {
    const res = await fetch(`${API}/get/${NAMESPACE}/${counterKey(minute)}?t=${Date.now()}`, {
      cache: 'no-store',
      mode: 'cors'
    });
    if (res.status === 404) return 0;
    if (!res.ok) throw new Error(`Presence read failed: ${res.status}`);
    const data = await res.json();
    return Math.max(0, Number(data.value) || 0);
  };

  const hitCounter = async (minute) => {
    const res = await fetch(`${API}/hit/${NAMESPACE}/${counterKey(minute)}?t=${Date.now()}`, {
      cache: 'no-store',
      mode: 'cors'
    });
    if (!res.ok) throw new Error(`Presence hit failed: ${res.status}`);
    const data = await res.json();
    return Math.max(0, Number(data.value) || 0);
  };

  const syncPresence = async () => {
    if (syncing) return;
    syncing = true;
    const minute = minuteId();
    let hitValue = null;

    try {
      let lastMinute = null;
      try { lastMinute = localStorage.getItem(MARKER); } catch (_) {}

      if (lastMinute !== minute) {
        try { localStorage.setItem(MARKER, minute); } catch (_) {}
        try {
          hitValue = await hitCounter(minute);
        } catch (error) {
          try {
            if (localStorage.getItem(MARKER) === minute) localStorage.removeItem(MARKER);
          } catch (_) {}
          throw error;
        }
      }

      const current = await readCounter(minute).catch(() => hitValue);
      if (current !== null && current !== undefined) render(current);
    } catch (_) {
      if (hitValue !== null) render(hitValue);
    } finally {
      syncing = false;
    }
  };

  syncPresence();
  window.setInterval(syncPresence, 5000);
  window.addEventListener('focus', syncPresence);
  window.addEventListener('pageshow', syncPresence);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) syncPresence();
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" href="favicon.png?v=5">
<link rel="apple-touch-icon" href="favicon.png?v=5">
<title>Ars Potionum · Manuale di Pozioni</title>
<meta name="robots" content="noarchive">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071811}
#book{display:block;width:100%;height:100%;border:0}
#scholar-presence{
  position:fixed;
  left:14px;
  bottom:12px;
  z-index:20;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 10px 7px;
  border:1px solid rgba(214,190,136,.16);
  border-radius:9px;
  background:rgba(7,24,17,.42);
  color:rgba(231,218,184,.72);
  font:italic 11px/1.35 Georgia,"Times New Roman",serif;
  letter-spacing:.01em;
  box-shadow:0 2px 10px rgba(0,0,0,.10);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  pointer-events:none;
  user-select:none;
  overflow:visible;
}
#scholar-presence .presence-dot{
  width:5px;
  height:5px;
  flex:0 0 auto;
  border-radius:50%;
  background:#9bae7b;
  box-shadow:0 0 5px rgba(155,174,123,.35);
  opacity:.75;
}
#scholar-presence-text{
  display:block;
  white-space:nowrap;
  padding:1px 1px 2px 0;
}
#wau-presence{
  position:fixed !important;
  left:-10000px !important;
  top:-10000px !important;
  width:1px !important;
  height:1px !important;
  overflow:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
  transform:none !important;
  margin:0 !important;
}
@media(max-width:700px){
  #scholar-presence{
    left:8px;
    bottom:8px;
    max-width:calc(100vw - 28px);
    padding:5px 9px 6px;
    font-size:10px;
    line-height:1.35;
    background:rgba(7,24,17,.34);
  }
}
@media print{html,body,#book,#scholar-presence{display:none!important}}
</style>
</head>
<body>
<iframe id="book" src="viewer/ars-potionum-viewer.html?v=20261015-v3-5" title="Ars Potionum" allow="fullscreen" allowfullscreen></iframe>

<div id="scholar-presence" aria-live="polite">
  <span class="presence-dot" aria-hidden="true"></span>
  <span id="scholar-presence-text">0 studiosi online</span>
  <span id="wau-presence" aria-label="Contatore visitatori in tempo reale">
    <script id="_wauapm">var _wau = _wau || []; _wau.push(["dynamic", "3mkyj1ebga", "apm", "2a1f16e7d7a8", "small"]);</script>
    <script async src="https://waust.at/d.js"></script>
  </span>
</div>

<script>
(() => {
  const frame = document.getElementById('book');
  const blockedShortcut = (e) => {
    const k = String(e.key || '').toLowerCase();
    const cmd = e.ctrlKey || e.metaKey;
    if (
      (cmd && ['s','u','p'].includes(k)) ||
      (cmd && e.shiftKey && ['i','j','c'].includes(k)) ||
      k === 'f12'
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  };

  const protect = () => {
    try {
      const d = frame.contentDocument;
      const w = frame.contentWindow;
      if (!d || !w) return;

      const download = d.getElementById('download');
      if (download) download.remove();

      const style = d.createElement('style');
      style.textContent = `
        img{-webkit-user-drag:none!important;user-drag:none!important}
        @media print{html,body{display:none!important}}
      `;
      d.head.appendChild(style);

      d.addEventListener('contextmenu', e => e.preventDefault(), true);
      d.addEventListener('dragstart', e => e.preventDefault(), true);
      d.addEventListener('selectstart', e => e.preventDefault(), true);
      d.addEventListener('copy', e => e.preventDefault(), true);
      d.addEventListener('cut', e => e.preventDefault(), true);
      d.addEventListener('keydown', blockedShortcut, true);
      w.addEventListener('keydown', blockedShortcut, true);
    } catch (_) {}
  };

  frame.addEventListener('load', protect);
  document.addEventListener('contextmenu', e => e.preventDefault(), true);
  document.addEventListener('dragstart', e => e.preventDefault(), true);
  document.addEventListener('keydown', blockedShortcut, true);
})();

(() => {
  const host = document.getElementById('wau-presence');
  const label = document.getElementById('scholar-presence-text');
  if (!host || !label) return;

  const updateLabel = () => {
    const textParts = [];
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const parent = node.parentElement;
      if (!parent || ['SCRIPT','STYLE'].includes(parent.tagName)) continue;
      const value = node.nodeValue.trim();
      if (value) textParts.push(value);
    }
    const visibleText = textParts.join(' ');
    const match = visibleText.match(/\b(\d{1,5})\b/);
    if (!match) return;

    const count = Math.max(0, Number(match[1]) || 0);
    label.textContent = count === 1
      ? '1 studioso online'
      : `${count} studiosi online`;
  };

  const observer = new MutationObserver(updateLabel);
  observer.observe(host, {childList:true, subtree:true, characterData:true});
  window.setTimeout(updateLabel, 1000);
  window.setTimeout(updateLabel, 3000);
})();
</script>
</body>
</html>

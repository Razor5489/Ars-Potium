<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ars Potionum · Manuale di Pozioni</title>
<link rel="shortcut icon" href="/Ars-Potium/favicon.ico?v=9" type="image/x-icon">
<link rel="icon" type="image/png" href="/Ars-Potium/favicon.png?v=9">
<link rel="apple-touch-icon" href="/Ars-Potium/favicon.png?v=9">
<meta name="theme-color" content="#071811">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071811}
#content{display:block;width:100%;height:100%;border:0}
@media print{html,body,#content{display:none!important}}
</style>
</head>
<body>
<iframe id="content" src="book-content.html" title="Ars Potionum" allowfullscreen></iframe>
<script>
(() => {
  const frame = document.getElementById('content');
  const block = e => {
    const k = String(e.key||'').toLowerCase();
    const cmd = e.ctrlKey || e.metaKey;
    if ((cmd && ['s','u','p'].includes(k)) || (cmd && e.shiftKey && ['i','j','c'].includes(k)) || k === 'f12') {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  };
  const protect = () => {
    try {
      const d = frame.contentDocument, w = frame.contentWindow;
      if (!d || !w) return;
      const download = d.getElementById('download');
      if (download) download.remove();
      if (!d.getElementById('background-music-script')) {
        const music = d.createElement('script');
        music.id = 'background-music-script';
        music.src = new URL('background-music.js?v=20261002-2', location.href).href;
        d.body.appendChild(music);
      }
      if (!d.getElementById('book-fixes-script')) {
        const fixes = d.createElement('script');
        fixes.id = 'book-fixes-script';
        fixes.src = new URL('book-fixes.js?v=20261002-backcover1', location.href).href;
        fixes.async = false;
        d.body.appendChild(fixes);
      }
      if (!d.getElementById('page-turn-sound-script')) {
        const sound = d.createElement('script');
        sound.id = 'page-turn-sound-script';
        sound.src = new URL('page-turn-sound.js?v=20261002-1', location.href).href;
        d.body.appendChild(sound);
      }
      d.addEventListener('contextmenu', e => e.preventDefault(), true);
      d.addEventListener('dragstart', e => e.preventDefault(), true);
      d.addEventListener('keydown', block, true);
      w.addEventListener('keydown', block, true);
    } catch (_) {}
  };
  frame.addEventListener('load', protect);
  document.addEventListener('contextmenu', e => e.preventDefault(), true);
  document.addEventListener('keydown', block, true);
})();
</script>
</body>
</html>

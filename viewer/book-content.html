<script id="book-data" type="application/json">{"pages":[{"image":"pages/page-01.webp","text":"ARS POTIONUM\nTractatus de Arte Potionaria\nAd usum Scholasticum Hogvartense\nProfessor Lucian Sharp\nHogwarts · MDCCC","folio":"Copertina"},{"image":"pages/page-02.webp","text":"ARS POTIONUM\nPRAEFATIO\nL’arte della precisione\nPrefazione del professor Lucian Sharp\nLa ricetta non è un suggerimento. Il vostro compito è comprenderla prima di pretendere di migliorarla.\nIl volume accompagna sette anni di formazione e distingue sempre conoscenza, abilità e autorizzazione.\nLe formule proibite o controllate restano soggette alle disposizioni del professore.","folio":"02"},{"image":"pages/page-03.webp","text":"ARS POTIONUM\nTABULA MATERIARUM\nIndice del volume\nSette anni, un solo metodo.\nPraefatio · L’arte della precisione — 2\nCursus Septem Annorum — 4\nFondamenti e disciplina del laboratorio — 5\nAnte Ignem · Prima di accendere il fuoco — 08A\nCalderone, Ars Ignis e De Motu — 08B\nTempus e gli errori del giovane pozionista — 08E\nAnnus Primus · I fondamenti — 9\nAnnus Secundus · Il governo del calore — 12\nAnnus Tertius · Essenza e trasformazione — 15\nAnnus Quartus · Protezione e antidoti — 19\nAnnus Quintus · Preparazioni composte — 22\nAnnus Sextus · Potenza e responsabilità — 26\nDe Licentia · Conoscenza e autorizzazione — 26A\nAnnus Septimus · Disciplina avanzata — 30\nDe Praeparatis Prohibitis — 33\nIudicium Potionarii — 36A\nInventario degli ingredienti — 37\nDomande e risposte di fine percorso — 39\nLexicon et Glossarium Potionarium — 41\nFinis — 42\nMANUALE DIDATTICO DI POZIONI\n03","_ap_mark":"AP-P03-40BC-6A4C","_ls_provenance":"LS-F03-BF1E-FF69","_zwm":"⁠​‌‌​‌‌​​‌​‌​‌‌‌‌‌​​‌​‌‌‌​‌‌​‌‌​​‌​‌​‌‌​‌⁠","folio":"03"},{"image":"pages/page-04.webp","text":"ARS POTIONUM\nCURSUS SEPTEM ANNORUM\nIl percorso dei sette anni\nConoscenza, abilità e autorizzazione sono requisiti distinti.\nAnno 1 / Abilità 0 / Pozione Wiggenweld / Pagina 10\nAnno 1 / Abilità 0 / Stufato Vigoroso / Pagina 11\nAnno 2 / Abilità 5 / Pozione Pepata / Pagina 13\nAnno 2 / Abilità 5 / Pozione di Bellezza / Pagina 14\nAnno 3 / Abilità 10 / Essenza di Dittamo / Pagina 16\nAnno 3 / Abilità 10 / Pozione Gonfiante / Pagina 17\nAnno 3 / Abilità 10 / Pozione Rimpicciolente / Pagina 18\nAnno 4 / Abilità 15 / Antidoto Comune / Pagina 20\nAnno 4 / Abilità 20 / Pozione Edurus / Pagina 21\nAnno 5 / Abilità 25 / Wiggenweld Concentrata / Pagina 23\nAnno 5 / Abilità 30 / Ossofast / Pagina 24\nAnno 5 / Abilità 35 / Pozione Maxima / Pagina 25\nAnno 6 / Abilità 40 / Veleno di Bottega [T] / Pagina 27\nAnno 6 / Abilità 45 / Distillato della Morte Vivente / Pagina 28\nAnno 6 / Abilità 50 / Pozione dell’Invisibilità / Pagina 29\nAnno 7 / Abilità 60 / Distillato di Tempesta / Pagina 31\nAnno 7 / Abilità 80 / Felix Felicis / Pagina 32\n[T] Solo teoria. La presenza di una formula nel volume non conferisce da sola il diritto di produrla o impiegarla.\nMANUALE DIDATTICO DI POZIONI\n04","folio":"04"},{"image":"pages/page-05.webp","text":"ARS POTIONUM\nFONDAMENTI\nChe cos’è una pozione?\nUna formula è una sequenza di trasformazioni, non un elenco di oggetti.\nUna pozione è un preparato magico il cui risultato dipende dagli ingredienti, dalle loro\nquantità e dalle operazioni che li mettono in relazione. L’acqua, il calore, la mescolatura e\nl’intervento della bacchetta non sono elementi ornamentali: fanno parte della formula quando\nla ricetta li prescrive.\nFormula, procedimento, risultato\nLa formula stabilisce quali materiali occorrono. Il procedimento ordina le azioni. Il risultato è\nil prodotto estratto al termine della sequenza. Confondere questi tre livelli porta a errori\ncomuni: seguire l’ordine della lista ingredienti, saltare un comando ripetuto o scambiare la\nresa per un moltiplicatore delle dosi.\nFamiglie di studio\nIl corso distingue preparati di sostegno e cura, alterazioni corporee o percettive, antidoti,\npreparazioni di potenziamento e sostanze pericolose. Sono categorie didattiche: una pozione\npuò sollevare problemi appartenenti a più famiglie. Il loro studio non assegna effetti numerici\nnon documentati.\nAspetto e identificazione\nColore, odore e consistenza possono essere utili elementi descrittivi quando una fonte li\nriporta. Non bastano però a riconoscere una boccetta sconosciuta. Nel ricettario fornito tali\ncaratteristiche non sono specificate: non saranno usate come criteri inventati di riuscita.\nAssunzione e applicazione\nUna preparazione può essere destinata, nella finzione, a ingestione, applicazione esterna o\naltre forme di impiego. La destinazione deve essere documentata: il nome “essenza” non\nautorizza a bere il contenuto, così come “distillato” non impone da solo un particolare\ncomando di lavorazione.\nPrima domanda del pozionista: che cosa so davvero di questa formula, e\nda quale fonte lo so?\nMANUALE DIDATTICO DI POZIONI\n05","folio":"05"},{"image":"pages/page-06.webp","text":"ARS POTIONUM\nFONDAMENTI\nGli strumenti del mestiere\nOgni strumento prepara una condizione di lavoro controllabile.\nIl banco deve permettere di riconoscere ogni ingrediente, mantenere separate le scorte e\nseguire la ricetta senza cercare materiali durante una fase delicata. La cura dell’attrezzatura\nprecede la competenza tecnica.\nIl calderone\nIl riferimento descrive il peltro come materiale da principianti, l’ottone come scelta\nintermedia e il rame come materiale che richiede maggiore prontezza nel controllo della\npreparazione. Questa progressione appartiene alla teoria del testo: non modifica\nautomaticamente i tempi del ricettario di gioco.\nMateriale\nImpiego didattico\nAttenzione richiesta\nPeltro\nFondamenti e prime esercitazioni\nMetodo, pulizia e regolarità.\nOttone\nConfronto fra lavorazioni\nControllo più consapevole dei tempi.\nRame\nApprofondimento avanzato\nPrecisione e minore margine narrativo\nd’errore.\nDotazione del banco\nBilancia e misurini servono alla teoria della misura; mortaio, pestello e coltello alla\npreparazione degli ingredienti; mestolo e bacchetta svolgono funzioni differenti. Boccette\npulite, etichette e un registro completano la dotazione del corso.\nAttrezzi narrativi e comandi effettivi\nPestare, tagliare, filtrare e distillare possono essere oggetto di lezione, ma non vanno\naggiunti come passaggi operativi alle 17 ricette se la schermata non li richiede. Una\ndescrizione di roleplay può accompagnare un comando senza sostituirlo.\nFonte teorica: volume di riferimento, pp. 16-18. Nessuno sconto percentuale ai tempi è applicato alle formule di\nquesta edizione.\nMANUALE DIDATTICO DI POZIONI\n06","folio":"06"},{"image":"pages/page-07.webp","text":"ARS POTIONUM\nFONDAMENTI\nLeggere prima di accendere\nIl metodo comune a tutte le schede.\n1. Contare\nLa quantità accanto a un ingrediente indica il numero di unità richieste. Quando compaiono\ndue righe uguali di aggiunta, ciascuna è un’azione distinta. Il numero accanto al nome del\npreparato indica invece la resa finale.\n2. Ordinare\nL’elenco delle scorte non stabilisce la sequenza. Nell’Antidoto Comune, per esempio, la\nRadice Amara è elencata prima della Centinodia ma viene aggiunta dopo. Si esegue il\nprocedimento numerato, non la lista della spesa.\n3. Governare fiamma e attesa\n“Fuoco basso” e “Fuoco alto” sono impostazioni esplicite. Il valore prescritto si mantiene fino\na un nuovo comando o allo spegnimento. “Attendi tra i 3 e massimo 15 secondi” è un intervallo del gioco: non\ndiventa arbitrariamente un numero di minuti.\n4. Distinguere mescolamento e magia\nOrario e antiorario non sono equivalenti. Neppure “Agita la bacchetta” è un sinonimo di\nmescolare: è un comando autonomo. Non vengono aggiunti numeri di giri, formule verbali o\ngesti assenti dalle schermate.\n5. Chiudere la sequenza\nLe schede richiedono di spegnere il fuoco, aggiungere le Boccette Vuote e infine estrarre. Se\nle boccette sono due, si conservano due aggiunte. Il completamento di queste azioni fa parte\ndella ricetta tanto quanto l’inserimento degli ingredienti.\n6. Registrare\nAnnotare nome, formula utilizzata, requisito di abilità, scorte e deviazioni osservate. Non\ninventare un colore finale o un effetto per giustificare una preparazione riuscita soltanto in\napparenza. In caso di errore si segnala il problema al docente, senza improvvisare correzioni.\nMANUALE DIDATTICO DI POZIONI\n07","folio":"07"},{"image":"pages/page-08.webp","text":"ARS POTIONUM\nFONDAMENTI\nLa disciplina del laboratorio\nNorme didattiche del corso.\nL’accesso a una ricetta non autorizza da solo a prepararla. Per le esercitazioni occorrono\nl’anno assegnato, l’abilità minima richiesta dal gioco e l’autorizzazione del docente. Una\nscheda contrassegnata “solo teoria” resta esclusa dalla pratica anche quando il personaggio\nsupera la soglia tecnica.\nPrima dell’esercitazione\nLeggere tutta la sequenza; verificare scorte e boccette; liberare il banco; controllare che il\ncalderone sia adatto e integro; proteggere mani e occhi nella descrizione di laboratorio. I\nmateriali non identificati non entrano nel calderone.\nDurante il lavoro\nProcedere un comando alla volta. Comunicare le anomalie senza nasconderle. Non scambiare\ningredienti fra banchi, non provare il prodotto sugli altri e non assaggiare una preparazione\nper verificarne la riuscita. L’attenzione al compagno non sostituisce la supervisione del\ndocente.\nIn caso di errore\nInterrompere l’esercitazione e chiedere istruzioni. La documentazione ricevuta non descrive\nmeccaniche di recupero: non si promette che acqua, altro calore o un ingrediente aggiuntivo\npossano salvare una formula compromessa. Anche il fallimento va registrato.\nConservazione e consegna\nConsegnare il prodotto con nome e identificazione dell’autore secondo il regolamento\ndell’aula. Non attribuire scadenze, dosi di assunzione o compatibilità fra pozioni che il gioco\nnon documenta. Una boccetta senza etichetta non è materiale di esercitazione.\nDivieto assoluto di produzione nel corso\nI preparati illegali e quelli riservati alla teoria possono essere appresi, discussi e riconosciuti\nsu carta. Non possono essere prodotti. L’esame teorico non revoca questo divieto, né il\ndocente lo supera assegnando una dimostrazione pratica.\nMANUALE DIDATTICO DI POZIONI\n08","folio":"08"},{"image":"pages/page-09.webp","text":"ARS POTIONUM\nFONDAMENTI\nANTE IGNEM — Prima di accendere il fuoco\nLa preparazione comincia prima del calderone.\nNessuna formula dovrebbe essere iniziata senza averne prima letto l’intero procedimento. Ingredienti, quantità, contenitori e strumenti devono essere verificati prima che il fuoco venga acceso.\nPrima della preparazione: contare le scorte; preparare contenitori e strumenti; leggere l’intera sequenza; individuare fiamma, attese, mescolamenti e interventi della bacchetta.\nRegola del professor Sharp: Se scoprite cosa dovete fare soltanto dopo aver acceso il fuoco, siete già in ritardo.\nMANUALE DIDATTICO DI POZIONI\n08A","folio":"08A"},{"image":"pages/page-10.webp","text":"ARS POTIONUM\nFONDAMENTI\nIL CALDERONE — Strumento, non recipiente\nIl calderone è il punto nel quale ingredienti, calore, attese e mescolamenti vengono messi in relazione. Prima dell’uso deve essere pulito, stabile e predisposto con gli strumenti necessari.\nIl manuale distingue peltro, ottone e rame come progressione didattica; la distinzione non modifica automaticamente dosi, tempi o comandi della ricetta.\nMANUALE DIDATTICO DI POZIONI\n08B","folio":"08B"},{"image":"pages/page-11.webp","text":"ARS POTIONUM\nFONDAMENTI\nARS IGNIS — Il governo della fiamma\nIl fuoco non accompagna la formula. Ne fa parte. Fuoco basso e fuoco alto restano validi fino a un nuovo comando o allo spegnimento. Il cambio di fiamma deve avvenire nella posizione prescritta dalla sequenza.\nMANUALE DIDATTICO DI POZIONI\n08C","folio":"08C"},{"image":"pages/page-12.webp","text":"ARS POTIONUM\nFONDAMENTI\nDE MOTU — L’arte del mescolamento\nMescolare non significa semplicemente girare. Senso, momento e posizione nella formula sono comandi distinti. Due aggiunte separate da un mescolamento non possono essere riunite.\nTre domande: in quale senso; in quale momento; dopo quale ingrediente.\nMANUALE DIDATTICO DI POZIONI\n08D","folio":"08D"},{"image":"pages/page-13.webp","text":"ARS POTIONUM\nFONDAMENTI\nTEMPUS — Attesa e precisione\nL’attesa è un comando. Il conteggio inizia dopo l’azione precedente; l’operazione successiva deve avvenire entro la finestra indicata senza anticipare il minimo né superare il massimo.\nMANUALE DIDATTICO DI POZIONI\n08E","folio":"08E"},{"image":"pages/page-14.webp","text":"ARS POTIONUM\nFONDAMENTI\nErrori del giovane pozionista\nErrori comuni: seguire l’inventario invece del procedimento; unire aggiunte separate; dimenticare il senso del mescolamento; cambiare la fiamma troppo presto; ignorare un’attesa; confondere resa e dosaggio; improvvisare passaggi non documentati.\nMANUALE DIDATTICO DI POZIONI\n08F","folio":"08F"},{"image":"pages/page-15.svg","text":"ARS POTIONUM\nANNO I\nI fondamenti\nFundamenta Potionum\nLettura, conteggio, ordine.","_ap_mark":"AP-P15-64EE-3670","_ls_provenance":"LS-F15-49B7-7E44","_zwm":"⁠​‌‌‌​‌​​​​‌‌​‌​‌​​‌‌​​​​‌‌‌‌‌​​​‌‌‌‌‌‌‌‌⁠","folio":"Anno I"},{"image":"pages/page-16.webp","text":"ARS POTIONUM\nANNO 1\nI fondamenti\nAbilità 0 · lettura, conteggio, ordine\nIl primo anno insegna a rendere il lavoro verificabile. Non serve la formula più spettacolare:\nserve una sequenza che lo studente sappia leggere, eseguire e ricostruire senza affidarsi alla\nmemoria del compagno.\nIngredienti e quantità\nWiggenweld e Stufato Vigoroso condividono acqua e fuoco basso, ma hanno ingredienti e rese\ndifferenti. Il primo richiede due Foglie di Dittamo distribuite nella sequenza; il secondo\nrestituisce due unità di prodotto usando una sola dotazione di ingredienti.\nIl valore dell’ordine\nSi comincia dichiarando la prima azione e si anticipa soltanto quella successiva. Nella\nWiggenweld un mescolamento divide due aggiunte dello stesso ingrediente: questo dimostra\nperché conoscere la lista non equivale a conoscere la ricetta.\nEsercitazione\nTrascrivere le due formule su un registro. Evidenziare ogni accensione, ogni attesa e ogni\nboccetta. Solo dopo il controllo del docente si passa alla sequenza di gioco. La verifica finale\nconfronta azioni compiute e righe della ricetta.\nConoscenze da acquisire\nDistinguere resa e quantità; riconoscere fuoco basso e senso orario; rispettare una finestra\nd’attesa; completare spegnimento, imbottigliamento ed estrazione. Non sono previsti veleni,\npreparati coercitivi o formule avanzate.\n«Il primo errore di un principiante è pensare che “semplice” significhi\n“approssimativo”.»\nMANUALE DIDATTICO DI POZIONI\n09","folio":"09"},{"image":"pages/page-17.webp","text":"ARS POTIONUM\nANNO 1 · RICETTARIO\nPozione Wiggenweld\nAbilità minima 0 / Resa ×1 / Scheda 01\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nPrima esercitazione sulla lettura di una formula. La ricetta introduce due aggiunte separate\ndello stesso ingrediente e due mescolamenti distinti: il conteggio delle scorte deve sempre\ncorrispondere alle azioni eseguite.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nFoglie di Dittamo\n2\nTentacoli di Murtlap\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco basso\n03\nAggiungi Foglie di Dittamo\n04\nMescola in senso orario\n05\nAggiungi Foglie di Dittamo\n06\nAggiungi Tentacoli di Murtlap\n07\nAttendi tra i 3 e massimo 15 secondi\n08\nMescola in senso orario\n09\nSpegni il fuoco\n10\nAggiungi Boccetta Vuota\n11\nEstrai\nPunto di controllo\nLe due Foglie di Dittamo non vengono aggiunte insieme: fra la prima e la seconda compare\nun mescolamento orario. La fiamma resta bassa fino allo spegnimento.\nDomanda di ripasso. Quale operazione separa le due aggiunte di Foglie di Dittamo?\nMANUALE DIDATTICO DI POZIONI\n10\n\nUso e natura: Preparato curativo di base, impiegato come primo rimedio restaurativo. Nel corso è soprattutto una lezione di ordine: lo stesso ingrediente compare in due momenti distinti e non può essere versato tutto insieme.\nNota del professor Sharp: Due foglie. Due momenti. Chi le confonde non ha letto la formula.","folio":"10"},{"image":"pages/page-18.webp","text":"ARS POTIONUM\nANNO 1 · RICETTARIO\nStufato Vigoroso\nAbilità minima 0 / Resa ×2 / Scheda 02\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nUna formula elementare con resa doppia. Serve a distinguere il nome del preparato dalla\nprocedura prevista dal ricettario: anche lo Stufato Vigoroso richiede boccette ed estrazione.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nCavolo Cinese Mordace\n1\nRadice di Zenzero\n1\nTimo\n1\nBoccetta Vuota\n2\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco basso\n03\nAggiungi Cavolo Cinese Mordace\n04\nAggiungi Radice di Zenzero\n05\nAggiungi Timo\n06\nMescola in senso orario\n07\nAttendi tra i 5 e massimo 25 secondi\n08\nSpegni il fuoco\n09\nAggiungi Boccetta Vuota\n10\nAggiungi Boccetta Vuota\n11\nEstrai\nPunto di controllo\nOccorrono due Boccette Vuote e due azioni separate per aggiungerle. Una resa di due non\nautorizza a raddoppiare anche gli ingredienti.\nDomanda di ripasso. Perché preparare due boccette non significa raddoppiare tutta la formula?\nMANUALE DIDATTICO DI POZIONI\n11\n\nUso e natura: Preparato tonico destinato a sostenere il vigore. La resa doppia lo rende utile per imparare che il numero di fiale ottenute non autorizza a raddoppiare o dimezzare arbitrariamente gli ingredienti.\nNota del professor Sharp: La resa appartiene alla formula. Non alla vostra fantasia.","folio":"11"},{"image":"pages/page-19.svg","text":"ARS POTIONUM\nANNO II\nIl governo del calore\nRegimen Ignis\nCalore, tempo e controllo.","folio":"Anno II"},{"image":"pages/page-20.webp","text":"ARS POTIONUM\nANNO 2\nIl governo del calore\nAbilità 5 · accensione e ingredienti a freddo\nIl secondo anno introduce una differenza essenziale: non tutte le preparazioni iniziano\nscaldando l’acqua. La Pozione Pepata richiede il fuoco alto subito; la Pozione di Bellezza\nriceve entrambe le unità di Malvadolce prima dell’accensione.\nFiamma come istruzione\n“Alto” e “basso” non sono valutazioni soggettive della potenza desiderata. Sono comandi della\nricetta. Alzare la fiamma per accelerare una formula a fuoco basso modifica la procedura\nsenza alcuna garanzia di riuscita.\nRipetizione e ritmo\nNella Pepata le due Radici di Zenzero entrano consecutivamente prima del mescolamento.\nNella Pozione di Bellezza accade lo stesso per la Malvadolce, ma a fuoco spento. Si impara\ncosì a non estrarre una regola generale da una sola formula.\nTeoria degli impieghi\nIl riferimento tratta preparati curativi e cosmetici, ma il corso non ricava da queste categorie\ndosi di assunzione o effetti garantiti. Saper preparare una formula non autorizza a\nsomministrarla a un compagno.\nEsercitazione comparativa\nPreparare due colonne sul registro: ingredienti aggiunti prima del fuoco e ingredienti\naggiunti dopo. Confrontare le ricette senza eseguirle contemporaneamente. La prova pratica\nconsiste in una sola preparazione alla volta.\n«Il fuoco non corregge la fretta. La rende soltanto più evidente.»\nMANUALE DIDATTICO DI POZIONI\n12","folio":"12"},{"image":"pages/page-21.webp","text":"ARS POTIONUM\nANNO 2 · RICETTARIO\nPozione Pepata\nAbilità minima 5 / Resa ×2 / Scheda 03\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nIl testo di riferimento presenta la Pepata nell’ambito dei rimedi contro i malanni da\nraffreddamento. Nel corso interessa soprattutto il passaggio dal fuoco basso al lavoro con\nfuoco alto; dosi ed effetti effettivi restano quelli stabiliti dal gioco.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nRadice di Zenzero\n2\nSpine di Pesce Leone\n1\nBoccetta Vuota\n2\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco alto\n03\nAggiungi Radice di Zenzero\n04\nAggiungi Radice di Zenzero\n05\nMescola in senso orario\n06\nAggiungi Spine di Pesce Leone\n07\nAttendi tra i 3 e massimo 12 secondi\n08\nSpegni il fuoco\n09\nAggiungi Boccetta Vuota\n10\nAggiungi Boccetta Vuota\n11\nEstrai\nPunto di controllo\nLa fiamma è alta già prima delle due aggiunte di Radice di Zenzero. Non sostituire il\nprocedimento di gioco con quello del manuale di riferimento.\nDomanda di ripasso. In quale momento entrano le Spine di Pesce Leone?\nMANUALE DIDATTICO DI POZIONI\n13\n\nUso e natura: Rimedio tradizionalmente associato ai malanni da raffreddamento. La sua utilità didattica sta nel governo della fiamma e nel passaggio controllato fra diverse intensità di calore.\nNota del professor Sharp: Il calore cura soltanto quando è quello prescritto.","folio":"13"},{"image":"pages/page-22.webp","text":"ARS POTIONUM\nANNO 2 · RICETTARIO\nPozione di Bellezza\nAbilità minima 5 / Resa ×1 / Scheda 04\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nEsercitazione sulle preparazioni a tema estetico. La sequenza permette di confrontare una\nformula in cui gli ingredienti entrano a fuoco spento con quelle che richiedono l’accensione\nsubito dopo l’acqua.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nMalvadolce\n2\nCorteccia di Cannella\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nAggiungi Malvadolce\n03\nAggiungi Malvadolce\n04\nFuoco basso\n05\nMescola in senso orario\n06\nAggiungi Corteccia di Cannella\n07\nAttendi tra i 3 e massimo 12 secondi\n08\nSpegni il fuoco\n09\nAggiungi Boccetta Vuota\n10\nEstrai\nPunto di controllo\nLe due aggiunte di Malvadolce precedono l’accensione. Non attribuire al preparato durata o\ntrasformazioni precise che la schermata non indica.\nDomanda di ripasso. Quali ingredienti sono già nel calderone quando si accende il fuoco?\nMANUALE DIDATTICO DI POZIONI\n14\n\nUso e natura: Preparato cosmetico destinato a modificare o valorizzare l’aspetto. La formula insegna che alcuni ingredienti devono entrare nel calderone prima dell’accensione della fiamma.\nNota del professor Sharp: Bellezza e precisione hanno una cosa in comune: entrambe tollerano male gli eccessi.","folio":"14"},{"image":"pages/page-23.svg","text":"ARS POTIONUM\nANNO III\nEssenza e trasformazione\nEssentia et Transmutatio\nRipetizione, differenza, trasformazione.","folio":"Anno III"},{"image":"pages/page-24.webp","text":"ARS POTIONUM\nANNO 3\nEssenza e trasformazione\nAbilità 10 · ripetizioni e differenze fra formule\nTre ricette con lo stesso requisito possono insegnare capacità differenti. L’Essenza di Dittamo\nrichiede un conteggio rigoroso; Gonfiante e Rimpicciolente richiedono di separare procedure\napparentemente speculari.\nL’essenza non è un’abbreviazione\nLe quattro aggiunte di Dittamo precedono il fuoco. La maggiore ripetitività aumenta il rischio\ndi perdere il conto. Si possono segnare le unità sul registro, ma non si accorpano i comandi\ndel gioco in un’unica operazione.\nDue formule, tre contrasti\nGonfiante e Rimpicciolente condividono la finestra 3-14 secondi e una struttura simile.\nDifferiscono negli ingredienti, nel livello di fiamma e nel verso del mescolamento. Ricordare\nsoltanto la struttura è quindi insufficiente.\nOpposizione non significa antidoto\nUn nome suggerisce un effetto, non una compatibilità. La Rimpicciolente non viene dichiarata\nantidoto della Gonfiante: tale relazione non compare nelle schermate. Il pozionista distingue\nuna deduzione plausibile da una proprietà confermata.\nEsercitazione\nConfrontare le due sequenze riga per riga e segnare le differenze. Presentare poi, a voce, la\nformula dell’Essenza di Dittamo, contando ogni aggiunta prima dell’accensione. Nessuna\nprova di trasformazione su persone è richiesta.\n«Le somiglianze vi aiutano a studiare. Le differenze vi impediscono di\nsbagliare.»\nMANUALE DIDATTICO DI POZIONI\n15","folio":"15"},{"image":"pages/page-25.webp","text":"ARS POTIONUM\nANNO 3 · RICETTARIO\nEssenza di Dittamo\nAbilità minima 10 / Resa ×2 / Scheda 05\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nNel riferimento il dittamo appartiene allo studio delle preparazioni curative. Questa formula\ndi gioco è un esercizio di precisione: pochi ingredienti non significano poche occasioni di\nerrore.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nFoglie di Dittamo\n4\nBoccetta Vuota\n2\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nAggiungi Foglie di Dittamo\n03\nAggiungi Foglie di Dittamo\n04\nAggiungi Foglie di Dittamo\n05\nAggiungi Foglie di Dittamo\n06\nFuoco basso\n07\nAttendi tra i 8 e massimo 30 secondi\n08\nMescola in senso antiorario\n09\nSpegni il fuoco\n10\nAggiungi Boccetta Vuota\n11\nAggiungi Boccetta Vuota\n12\nEstrai\nPunto di controllo\nContare quattro aggiunte di Foglie di Dittamo prima di accendere. Il mescolamento antiorario\navviene soltanto dopo l’attesa.\nDomanda di ripasso. Quante aggiunte precedono il fuoco basso, compresa l’acqua?\nMANUALE DIDATTICO DI POZIONI\n16\n\nUso e natura: Essenza curativa ricavata dal Dittamo, pianta nota per il suo impiego restaurativo. È una formula relativamente breve, ma proprio per questo ogni errore di conteggio diventa evidente.\nNota del professor Sharp: Pochi ingredienti non significano poche occasioni di sbagliare.","folio":"16"},{"image":"pages/page-26.webp","text":"ARS POTIONUM\nANNO 3 · RICETTARIO\nPozione Gonfiante\nAbilità minima 10 / Resa ×1 / Scheda 06\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nFormula dedicata allo studio delle alterazioni corporee nel gioco. Il suo valore didattico\nemerge dal confronto con la Rimpicciolente: le due sequenze si somigliano, ma non\ncondividono né ingredienti né impostazione del fuoco e del mescolamento.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nCipolla Puzzona\n2\nStarnutina\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nAggiungi Cipolla Puzzona\n03\nAggiungi Cipolla Puzzona\n04\nFuoco alto\n05\nMescola in senso orario\n06\nAttendi tra i 3 e massimo 14 secondi\n07\nAggiungi Starnutina\n08\nSpegni il fuoco\n09\nAggiungi Boccetta Vuota\n10\nEstrai\nPunto di controllo\nLa Starnutina viene aggiunta dopo l’attesa. Fuoco alto e senso orario distinguono questa\nformula dalla Rimpicciolente.\nDomanda di ripasso. Quali due comandi cambiano rispetto alla Pozione Rimpicciolente?\nMANUALE DIDATTICO DI POZIONI\n17\n\nUso e natura: Preparato destinato a provocare un marcato rigonfiamento corporeo. Nel corso viene studiato in coppia con la Rimpicciolente per mostrare che effetti opposti non implicano formule speculari.\nNota del professor Sharp: Opposto non significa inverso. Ricordatelo.","folio":"17"},{"image":"pages/page-27.webp","text":"ARS POTIONUM\nANNO 3 · RICETTARIO\nPozione Rimpicciolente\nAbilità minima 10 / Resa ×1 / Scheda 07\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nSeconda formula del confronto sulle alterazioni corporee. L’opposizione suggerita dai nomi\nnon prova che una pozione annulli l’altra: la funzione di antidoto deve essere confermata\ndalle regole del gioco.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nFico Grinzoso\n2\nRuta\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nAggiungi Fico Grinzoso\n03\nAggiungi Fico Grinzoso\n04\nFuoco basso\n05\nMescola in senso antiorario\n06\nAttendi tra i 3 e massimo 14 secondi\n07\nAggiungi Ruta\n08\nSpegni il fuoco\n09\nAggiungi Boccetta Vuota\n10\nEstrai\nPunto di controllo\nLa Ruta segue l’attesa. Il fuoco è basso e il mescolamento è antiorario: non trasferire per\nabitudine i comandi della Gonfiante.\nDomanda di ripasso. Si può dedurre dal nome che questa pozione sia un antidoto alla Gonfiante?\nMANUALE DIDATTICO DI POZIONI\n18\n\nUso e natura: Preparato destinato a ridurre le dimensioni del bersaglio. Il confronto con la Gonfiante serve a evitare un errore comune: due pozioni dagli effetti contrari non sono automaticamente antidoti reciproci.\nNota del professor Sharp: Il nome suggerisce l’effetto. La formula decide tutto il resto.","folio":"18"},{"image":"pages/page-28.svg","text":"ARS POTIONUM\nANNO IV\nProtezione e antidoti\nPraesidia et Antidota\nSpecificità, protezione, gesto magico.","folio":"Anno IV"},{"image":"pages/page-29.webp","text":"ARS POTIONUM\nANNO 4\nProtezione e antidoti\nAbilità 15-20 · specificità e gesto magico\nIl quarto anno unisce due problemi: riconoscere i limiti di un antidoto e coordinare\nl’intervento della bacchetta con le operazioni del calderone. L’Antidoto Comune e l’Edurus\nnon sono due risposte intercambiabili a una stessa minaccia.\nAntidoto comune e antidoto specifico\nUn antidoto può essere rivolto a una famiglia di effetti oppure a una determinata sostanza.\n“Comune” non significa universale. In assenza di un elenco di compatibilità, non si dichiara\nrisolto un avvelenamento perché si possiede una boccetta di Antidoto Comune.\nStudio dei veleni\nIl riferimento dedica il quarto anno a veleni e antidoti. Nel presente corso la conoscenza dei\nveleni è introdotta attraverso classificazione, riconoscimento del rischio e responsabilità; non\nmediante produzione o somministrazione di sostanze nocive.\nLa bacchetta nella formula\nEdurus richiede un solo gesto magico, dopo il secondo mescolamento antiorario. Non viene\naggiunta una formula verbale: il comando documentato è “Agita la bacchetta”. Il gesto non\nsostituisce il controllo della fiamma né conclude da solo la preparazione.\nEsercitazione\nRicostruire l’ordine di aggiunta dell’Antidoto Comune partendo dalla lista delle scorte, poi\nconfrontarlo con il procedimento. Per Edurus, individuare il punto preciso in cui si passa dal\nmestolo alla bacchetta.\n«Un rimedio di cui ignorate i limiti può diventare una seconda\nimprudenza.»\nMANUALE DIDATTICO DI POZIONI\n19","folio":"19"},{"image":"pages/page-30.webp","text":"ARS POTIONUM\nANNO 4 · RICETTARIO\nAntidoto Comune\nAbilità minima 15 / Resa ×1 / Scheda 08\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nIntroduzione alla distinzione fra antidoto comune e antidoto specifico. La schermata non\nelenca i veleni contrastati: il preparato non viene quindi presentato come rimedio universale\nné come risposta certa al Veleno di Bottega.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nRadice Amara\n1\nCentinodia\n2\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco basso\n03\nAggiungi Centinodia\n04\nAggiungi Centinodia\n05\nMescola in senso orario\n06\nAggiungi Radice Amara\n07\nAttendi tra i 4 e massimo 18 secondi\n08\nMescola in senso orario\n09\nSpegni il fuoco\n10\nAggiungi Boccetta Vuota\n11\nEstrai\nPunto di controllo\nLa Centinodia entra prima della Radice Amara, anche se l’elenco delle scorte cita la radice\nper prima. Sono previsti due mescolamenti orari.\nDomanda di ripasso. L’ordine dell’elenco ingredienti coincide sempre con l’ordine operativo?\nMANUALE DIDATTICO DI POZIONI\n20\n\nUso e natura: Antidoto di impiego generale contro determinate sostanze nocive. Non deve essere trattato come rimedio universale: la compatibilità con uno specifico veleno va sempre verificata.\nNota del professor Sharp: ‘Comune’ non significa ‘onnipotente’.","folio":"20"},{"image":"pages/page-31.webp","text":"ARS POTIONUM\nANNO 4 · RICETTARIO\nPozione Edurus\nAbilità minima 20 / Resa ×1 / Scheda 09\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nPrima ricetta del percorso che introduce esplicitamente il comando di bacchetta. Lo studente\ndeve separare il gesto magico dall’agitazione del liquido: sono due azioni diverse e occupano\nposizioni precise.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nScaglia di Drago\n2\nPungiglione di Verme Cieco\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco alto\n03\nAggiungi Scaglia di Drago\n04\nAggiungi Scaglia di Drago\n05\nMescola in senso antiorario\n06\nAttendi tra i 5 e massimo 20 secondi\n07\nAggiungi Pungiglione di Verme Cieco\n08\nMescola in senso antiorario\n09\nAgita la bacchetta\n10\nSpegni il fuoco\n11\nAggiungi Boccetta Vuota\n12\nEstrai\nPunto di controllo\nAgita la bacchetta segue il secondo mescolamento antiorario e precede lo spegnimento. La\nschermata non prescrive una formula verbale.\nDomanda di ripasso. Quale azione precede immediatamente il gesto di bacchetta?\nMANUALE DIDATTICO DI POZIONI\n21\n\nUso e natura: Preparato protettivo che indurisce temporaneamente il corpo e ne accresce la resistenza. È la prima formula del percorso in cui l’azione della bacchetta deve essere distinta con precisione dal mescolamento.\nNota del professor Sharp: Una bacchetta agitata nel momento sbagliato resta un errore elegante.","folio":"21"},{"image":"pages/page-32.svg","text":"ARS POTIONUM\nANNO V\nLe preparazioni composte\nPraeparationes Compositae\nPiù fasi, un solo metodo.","_ap_mark":"AP-P32-A738-7D7C","_ls_provenance":"LS-F32-A783-EBAD","_zwm":"⁠‌‌​‌‌‌‌‌​‌‌​‌​​‌​​‌​​​​​​‌‌‌‌​‌‌‌​‌​​‌‌‌⁠","folio":"Anno V"},{"image":"pages/page-33.webp","text":"ARS POTIONUM\nANNO 5\nLe preparazioni composte\nAbilità 25-35 · più fasi nella stessa formula\nIl quinto anno richiede di leggere una ricetta come una successione di fasi, mantenendo però\nintatti tutti i comandi. Cambiare fuoco o senso di mescolamento segna un passaggio che lo\nstudente deve saper anticipare.\nConcentrazione e nuova formula\nWiggenweld Concentrata cambia più della quantità di ingredienti: introduce fuoco alto, un\nsuccessivo abbassamento, mescolamento antiorario e Uovo di Runespoor. Il risultato\nconcentrato non si deduce da una proporzione aritmetica applicata alla formula elementare.\nSequenze termiche diverse\nOssofast passa dal fuoco alto a quello basso; Maxima compie il percorso inverso. Il cambio\ndeve essere ricordato insieme alla sua posizione: dopo il secondo mescolamento in Ossofast,\nprima delle Uova di Doxy nella Maxima.\nCompetenza medimagica\nIl caso di Ossofast permette di distinguere preparazione e impiego. Un prodotto associato alla\ncura non è una licenza per diagnosticare o intervenire in qualsiasi situazione. Il corso valuta\nla formula; l’utilizzo segue la competenza e le regole previste nella finzione.\nEsercitazione\nPer ogni ricetta segnare tre elementi: cambi di fiamma, cambi di verso e momento della\nbacchetta. Presentare una ricostruzione orale completa prima della prova pratica. La\nsuddivisione in fasi serve a studiare, non ad abbreviare il procedimento.\n«La padronanza non consiste nel fare più in fretta, ma nel sapere quale\nprecisione richiede ogni istante.»\nMANUALE DIDATTICO DI POZIONI\n22","folio":"22"},{"image":"pages/page-34.webp","text":"ARS POTIONUM\nANNO 5 · RICETTARIO\nWiggenweld Concentrata\nAbilità minima 25 / Resa ×1 / Scheda 10\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nUna formula distinta dalla Wiggenweld di primo anno: cambiano quantità, ingrediente finale,\nlivello di fiamma, senso di mescolamento e presenza del gesto magico. Non si ottiene\nsemplicemente moltiplicando la ricetta base.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nFoglie di Dittamo\n3\nTentacoli di Murtlap\n2\nUovo di Runespoor\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco alto\n03\nAggiungi Foglie di Dittamo\n04\nAggiungi Foglie di Dittamo\n05\nAggiungi Foglie di Dittamo\n06\nMescola in senso orario\n07\nAttendi tra i 5 e massimo 20 secondi\n08\nFuoco basso\n09\nAggiungi Tentacoli di Murtlap\n10\nAggiungi Tentacoli di Murtlap\n11\nMescola in senso antiorario\n12\nAggiungi Uovo di Runespoor\n13\nAgita la bacchetta\n14\nSpegni il fuoco\n15\nAggiungi Boccetta Vuota\n16\nEstrai\nPunto di controllo\nIl passaggio da fuoco alto a basso avviene dopo l’attesa e prima dei due Tentacoli di Murtlap.\nL’Uovo di Runespoor segue il mescolamento antiorario.\nDomanda di ripasso. Quali passaggi dimostrano che questa non è una semplice dose maggiore di Wiggenweld?\nMANUALE DIDATTICO DI POZIONI\n23\n\nUso e natura: Versione più complessa e concentrata della Wiggenweld, destinata a un effetto restaurativo più incisivo. Non si ottiene moltiplicando la ricetta di primo anno: cambia l’intera struttura della preparazione.\nNota del professor Sharp: Concentrata non significa ‘la stessa cosa, ma di più’.","folio":"23"},{"image":"pages/page-35.webp","text":"ARS POTIONUM\nANNO 5 · RICETTARIO\nOssofast\nAbilità minima 30 / Resa ×1 / Scheda 11\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nIl riferimento associa Ossofast alla ricrescita delle ossa. La conoscenza della formula non\nconferisce competenza medimagica: l’impiego narrativo va distinto dalla semplice riuscita\ndella preparazione.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nArtiglio di Drago\n1\nBulbo di Scilla\n2\nCorteccia di Cannella\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco alto\n03\nAggiungi Artiglio di Drago\n04\nAttendi tra i 6 e massimo 25 secondi\n05\nMescola in senso orario\n06\nAggiungi Bulbo di Scilla\n07\nAggiungi Bulbo di Scilla\n08\nMescola in senso orario\n09\nFuoco basso\n10\nAggiungi Corteccia di Cannella\n11\nAgita la bacchetta\n12\nSpegni il fuoco\n13\nAggiungi Boccetta Vuota\n14\nEstrai\nPunto di controllo\nL’attesa segue subito l’Artiglio di Drago; i due Bulbi di Scilla vengono aggiunti dopo il primo\nmescolamento. La Corteccia di Cannella entra a fuoco basso.\nDomanda di ripasso. Quando si abbassa la fiamma rispetto al secondo mescolamento?\nMANUALE DIDATTICO DI POZIONI\n24\n\nUso e natura: Preparato medimagico associato alla ricrescita delle ossa. La corretta preparazione non equivale a competenza clinica: l’impiego su un paziente richiede conoscenze ulteriori e supervisione.\nNota del professor Sharp: Saper riempire una fiala non vi rende medimaghi.","folio":"24"},{"image":"pages/page-36.webp","text":"ARS POTIONUM\nANNO 5 · RICETTARIO\nPozione Maxima\nAbilità minima 35 / Resa ×1 / Scheda 12\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nEsercizio sul controllo di una sequenza che aumenta la fiamma invece di diminuirla. La\nformula presenta ingredienti già incontrati, ma un loro uso diverso: familiarità non equivale a\nintercambiabilità.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nSpine di Pesce Leone\n2\nUova di Doxy\n1\nAssenzio\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco basso\n03\nAggiungi Spine di Pesce Leone\n04\nMescola in senso orario\n05\nAggiungi Spine di Pesce Leone\n06\nMescola in senso orario\n07\nFuoco alto\n08\nAggiungi Uova di Doxy\n09\nAttendi tra i 4 e massimo 18 secondi\n10\nAggiungi Assenzio\n11\nAgita la bacchetta\n12\nSpegni il fuoco\n13\nAggiungi Boccetta Vuota\n14\nEstrai\nPunto di controllo\nOgni aggiunta di Spine di Pesce Leone è seguita da un proprio mescolamento orario. Si passa\nal fuoco alto prima delle Uova di Doxy.\nDomanda di ripasso. Qual è la differenza fra il cambio di fiamma della Maxima e quello di Ossofast?\nMANUALE DIDATTICO DI POZIONI\n25\n\nUso e natura: Pozione di potenziamento destinata ad accrescere temporaneamente l’efficacia della magia. La formula è utile per studiare una sequenza termica che procede dal fuoco basso verso quello alto.\nNota del professor Sharp: La potenza senza controllo è solo un modo più rapido di fallire.","folio":"25"},{"image":"pages/page-37.svg","text":"ARS POTIONUM\nANNO VI\nPotenza e responsabilità\nPotentia et Disciplina\nTecnica, rischio e responsabilità.","folio":"Anno VI"},{"image":"pages/page-38.webp","text":"ARS POTIONUM\nANNO 6\nPotenza e responsabilità\nAbilità 40-50 · rischio e limiti di produzione\nIl sesto anno affianca alla tecnica il giudizio. Il Veleno di Bottega viene studiato\nesclusivamente sulla carta. Distillato della Morte Vivente e Invisibilità richiedono invece\nun’analisi rigorosa di passaggi e impieghi, senza attribuire al loro nome un divieto che le fonti\nnon dichiarano.\nConoscere non autorizza\nUna soglia di abilità misura l’accesso tecnico nel gioco. Non prova che il server consenta ogni\nuso e non supera i divieti del corso. Per il Veleno di Bottega la produzione è vietata anche\nquando l’abilità raggiunge 40 o un valore superiore.\nNomi simili, preparati distinti\nDistillato della Morte Vivente e Pozione della Morte non sono la stessa sostanza. La seconda è\ninserita dal riferimento nella raccolta dei preparati illegali; la prima è trattata separatamente\nfra le conoscenze avanzate.\nUso ed effetto\nL’Invisibilità non viene definita illegale soltanto perché può essere impiegata di nascosto. Gli\nimpieghi scorretti e lo status del preparato sono questioni diverse. Nel corso valgono\ncomunque il divieto di somministrazione non autorizzata e il controllo del docente.\nEsercitazione\nPer il veleno: lettura e discussione della scheda, senza materiali e senza calderone acceso.\nPer le altre due ricette: ricostruzione dei comandi e, soltanto con autorizzazione, pratica\nsorvegliata. Il distillato soporifero non viene provato sugli studenti.\n«Il limite non è ciò che siete capaci di ottenere. È ciò che siete autorizzati\na fare.»\nMANUALE DIDATTICO DI POZIONI\n26","folio":"26"},{"image":"pages/page-39.webp","text":"ARS POTIONUM\nDISCIPLINA E AUTORIZZAZIONE\nDE LICENTIA — Conoscere non significa essere autorizzati\nStudio, produzione e impiego sono livelli distinti. La conoscenza di una formula non conferisce automaticamente il diritto di produrla, possederla o utilizzarla.\nPreparazioni soggette a restrizione: Distillato della Morte Vivente; Veleno di Bottega; Felix Felicis; Pozione dell’Invisibilità. Produzione non autorizzata proibita; uso non autorizzato proibito; studio secondo indicazione del docente e restrizioni specifiche.\nMANUALE DIDATTICO DI POZIONI\n26A","folio":"26A"},{"image":"pages/page-40.webp","text":"ARS POTIONUM\nANNO 6 · RICETTARIO\nVeleno di Bottega\nAbilità minima 40 / Resa ×1 / Scheda 13\nSOLO STUDIO TEORICO · PRODUZIONE VIETATA\nScheda conservata per completezza del ricettario e per l’analisi teorica della sequenza. La\nschermata ne indica il requisito di abilità, ma non lo status legale: il divieto di produzione qui\napplicato è una regola del corso.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nVeleno di Ragno\n2\nBelladonna\n1\nBoccetta Vuota\n1\nSequenza da conoscere (non eseguire)\n01\nAggiungi Acqua Distillata\n02\nAggiungi Veleno di Ragno\n03\nAggiungi Veleno di Ragno\n04\nFuoco alto\n05\nMescola in senso antiorario\n06\nAttendi tra i 4 e massimo 18 secondi\n07\nAggiungi Belladonna\n08\nSpegni il fuoco\n09\nAggiungi Boccetta Vuota\n10\nEstrai\nPunto di controllo\nNessuna esercitazione di produzione. Le unità sono oggetti dell’inventario di gioco, non dosi\nreali. Non è documentato che l’Antidoto Comune neutralizzi questo preparato.\nDomanda di ripasso. Perché abilità sufficiente e conoscenza della sequenza non autorizzano a produrlo?\nMANUALE DIDATTICO DI POZIONI\n27\n\nUso e natura: Preparato tossico conservato nel volume esclusivamente per riconoscimento e studio teorico. Nel corso la produzione è vietata a prescindere dall’abilità tecnica raggiunta.\nNota del professor Sharp: Sapere come si prepara un veleno non è un motivo per prepararlo.","folio":"27"},{"image":"pages/page-41.webp","text":"ARS POTIONUM\nANNO 6 · RICETTARIO\nDistillato della Morte Vivente\nAbilità minima 45 / Resa ×1 / Scheda 14\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nNel riferimento è un preparato soporifero di livello avanzato. Non va confuso con la Pozione\ndella Morte del repertorio illegale: sono due voci differenti. Il nome da solo non determina\nuno status giuridico.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nAsfodelo\n1\nAssenzio\n2\nLevistico\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nAggiungi Assenzio\n03\nAggiungi Assenzio\n04\nFuoco basso\n05\nMescola in senso antiorario\n06\nAttendi tra i 8 e massimo 30 secondi\n07\nAggiungi Asfodelo\n08\nMescola in senso antiorario\n09\nAggiungi Levistico\n10\nAgita la bacchetta\n11\nSpegni il fuoco\n12\nAggiungi Boccetta Vuota\n13\nEstrai\nPunto di controllo\nL’Asfodelo entra dopo l’attesa e il Levistico dopo il secondo mescolamento. Per il corso:\npratica soltanto con supervisione diretta, senza prove su studenti.\nDomanda di ripasso. Perché non è corretto identificarlo con la Pozione della Morte?\nMANUALE DIDATTICO DI POZIONI\n28\n\nUso e natura: Soporifero avanzato di eccezionale potenza, capace di indurre uno stato simile alla morte. Non va confuso con la distinta Pozione della Morte, appartenente al repertorio proibito.\nNota del professor Sharp: I nomi simili sono una trappola per chi legge in fretta.","folio":"28"},{"image":"pages/page-42.webp","text":"ARS POTIONUM\nANNO 6 · RICETTARIO\nPozione dell’Invisibilità\nAbilità minima 50 / Resa ×1 / Scheda 15\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nLa trattazione di riferimento colloca l’invisibilità tra le alterazioni dell’aspetto percepibile. La\nricetta di gioco è qui collocata al sesto anno per la soglia 50; durata, limiti e modalità\ndell’effetto non compaiono nella schermata.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nFluxweed\n2\nOcchi di Pesce Palla\n2\nBelladonna\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nAggiungi Fluxweed\n03\nAggiungi Fluxweed\n04\nFuoco basso\n05\nAttendi tra i 10 e massimo 40 secondi\n06\nMescola in senso antiorario\n07\nAggiungi Occhi di Pesce Palla\n08\nAggiungi Occhi di Pesce Palla\n09\nMescola in senso antiorario\n10\nMescola in senso antiorario\n11\nAggiungi Belladonna\n12\nAgita la bacchetta\n13\nSpegni il fuoco\n14\nAggiungi Boccetta Vuota\n15\nEstrai\nPunto di controllo\nDopo i due Occhi di Pesce Palla sono richiesti due mescolamenti antiorari consecutivi. Non\ncomprimerli in un solo comando.\nDomanda di ripasso. Quanti comandi di mescolamento contiene in tutto la formula?\nMANUALE DIDATTICO DI POZIONI\n29\n\nUso e natura: Preparato che rende il soggetto invisibile o difficilmente percepibile alla vista. La riuscita della formula non concede alcun diritto di usarla per sottrarsi a regole, sorveglianza o responsabilità.\nNota del professor Sharp: Essere invisibili non rende invisibili le conseguenze.","folio":"29"},{"image":"pages/page-43.svg","text":"ARS POTIONUM\nANNO VII\nLa disciplina avanzata\nArs Potionaria Provecta\nSequenze multiple, giudizio ed etica.","folio":"Anno VII"},{"image":"pages/page-44.webp","text":"ARS POTIONUM\nANNO 7\nLa disciplina avanzata\nAbilità 60-80 · sequenze multiple ed etica\nL’ultimo anno non elimina le regole imparate nel primo. Le rende più esigenti. Distillato di\nTempesta e Felix Felicis richiedono due gesti magici, un controllo accurato della sequenza e\nla capacità di spiegare ogni passaggio senza introdurre varianti.\nDue attivazioni distinte\nNel Distillato di Tempesta la bacchetta interviene dopo la Scaglia di Drago e dopo l’Uovo di\nRunespoor. Fra i due gesti cambia il senso di mescolamento. Una generica indicazione\n“agitare due volte” cancellerebbe la struttura della ricetta.\nLe due attese della Felix Felicis\nLa prima finestra è 12-45 secondi, ancora a fuoco basso. La seconda è 5-20 secondi dopo\nl’Uovo di Runespoor e il primo gesto magico, quando il fuoco è già alto. Le due attese non si\nsommano né si scambiano.\nFortuna e correttezza\nIl riferimento vieta l’impiego della Felix Felicis nei compiti, negli esami e nelle competizioni\nufficiali. Questo è un divieto d’uso in contesti specifici. Non deve essere trasformato, senza\naltra fonte, in un divieto assoluto di fabbricazione.\nProva conclusiva\nDifendere oralmente una formula scelta dal docente: quantità, successione, finestre d’attesa e\nvincoli d’impiego. La pratica riguarda soltanto preparazioni ammesse. I preparati illegali sono\noggetto di domande teoriche, mai di produzione.\n«Il pozionista maturo sa eseguire una formula. Quello degno di fiducia sa\nanche quando deve lasciarla sul libro.»\nMANUALE DIDATTICO DI POZIONI\n30","folio":"30"},{"image":"pages/page-45.webp","text":"ARS POTIONUM\nANNO 7 · RICETTARIO\nDistillato di Tempesta\nAbilità minima 60 / Resa ×1 / Scheda 16\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nFormula conclusiva sul coordinamento fra ingredienti, mescolamento e attivazione magica.\nRichiede due gesti di bacchetta in momenti distinti e il passaggio dal senso orario a quello\nantiorario.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nScaglia di Drago\n1\nUovo di Runespoor\n1\nAli di Cavalluccio\n2\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco alto\n03\nAggiungi Ali di Cavalluccio\n04\nAggiungi Ali di Cavalluccio\n05\nMescola in senso orario\n06\nAttendi tra i 4 e massimo 16 secondi\n07\nAggiungi Scaglia di Drago\n08\nAgita la bacchetta\n09\nMescola in senso antiorario\n10\nAggiungi Uovo di Runespoor\n11\nAgita la bacchetta\n12\nSpegni il fuoco\n13\nAggiungi Boccetta Vuota\n14\nEstrai\nPunto di controllo\nLa prima agitazione della bacchetta segue la Scaglia di Drago; la seconda segue l’Uovo di\nRunespoor. La fiamma resta alta fino allo spegnimento.\nDomanda di ripasso. Quali ingredienti precedono rispettivamente i due gesti di bacchetta?\nMANUALE DIDATTICO DI POZIONI\n31\n\nUso e natura: Preparato offensivo che richiama una tempesta magica attorno a chi lo impiega. La ricetta richiede due attivazioni di bacchetta e un cambio di direzione nel mescolamento.\nNota del professor Sharp: Una tempesta obbedisce alla formula meglio di molti studenti.","folio":"31"},{"image":"pages/page-46.webp","text":"ARS POTIONUM\nANNO 7 · RICETTARIO\nFelix Felicis\nAbilità minima 80 / Resa ×1 / Scheda 17\nFORMULA DIDATTICA · PRATICA CON AUTORIZZAZIONE\nLa “fortuna liquida” conclude il percorso. Il riferimento ne vieta l’uso durante compiti, esami\ne competizioni ufficiali; tale restrizione d’uso non equivale a un divieto assoluto di\nproduzione.\nIngredienti e contenitori\nUnità di gioco\nAcqua Distillata\n1\nUovo di Runespoor\n1\nArtiglio di Drago\n1\nAsfodelo\n2\nMalvadolce\n1\nBoccetta Vuota\n1\nProcedimento\n01\nAggiungi Acqua Distillata\n02\nFuoco basso\n03\nAggiungi Asfodelo\n04\nMescola in senso orario\n05\nAggiungi Asfodelo\n06\nMescola in senso orario\n07\nAttendi tra i 12 e massimo 45 secondi\n08\nFuoco alto\n09\nAggiungi Uovo di Runespoor\n10\nAgita la bacchetta\n11\nAttendi tra i 5 e massimo 20 secondi\n12\nAggiungi Artiglio di Drago\n13\nMescola in senso antiorario\n14\nAggiungi Malvadolce\n15\nAgita la bacchetta\n16\nSpegni il fuoco\n17\nAggiungi Boccetta Vuota\n18\nEstrai\nPunto di controllo\nDue attese diverse: 12-45 secondi a fuoco basso, poi 5-20 dopo il primo gesto magico. Per la\nricetta di gioco non si aggiungono i sei mesi né l’incantesimo del riferimento.\nDomanda di ripasso. Quale divieto riguarda il suo impiego durante un esame?\nMANUALE DIDATTICO DI POZIONI\n32\n\nUso e natura: La celebre ‘fortuna liquida’, destinata a favorire temporaneamente gli esiti delle azioni di chi la assume. Il suo impiego è vietato in compiti, esami e competizioni ufficiali.\nNota del professor Sharp: Se avete bisogno della fortuna per superare l’esame, non siete pronti per l’esame.","folio":"32"},{"image":"pages/page-47.webp","text":"ARS POTIONUM\nDE PRAEPARATIS PROHIBITIS\nIllegale, vietato, controllato\nSolo studio teorico: produzione vietata.","_ap_mark":"AP-P47-2109-284B","_ls_provenance":"LS-F47-0B42-1C12","_zwm":"⁠‌​‌​‌​​‌​​‌‌​‌‌‌‌‌‌‌​‌‌‌‌​​​‌​​‌​​‌​‌‌‌‌⁠","folio":"33"},{"image":"pages/page-48.webp","text":"ARS POTIONUM\nCATALOGUS PROHIBITORUM\nI preparati proibiti\nPozione dell’Amicizia; Bevanda della Disperazione; Pozione della Morte; Pozione della Rigenerazione. Apprendimento teorico consentito; produzione vietata.","folio":"34"},{"image":"pages/page-49.webp","text":"ARS POTIONUM\nDE VENENIS\nIl repertorio dei veleni\nRiconoscere il rischio senza produrlo. Produzione vietata nel corso.","folio":"35"},{"image":"pages/page-50.webp","text":"ARS POTIONUM\nRESTRICTIONES SPECIALES\nAmortentia; Veritaserum; Felix Felicis; Distillato della Morte Vivente; Pozione dell’Invisibilità. Restrizioni specifiche e controllo didattico.","folio":"36"},{"image":"pages/page-51.webp","text":"ARS POTIONUM\nDISCIPLINA AVANZATA\nIUDICIUM POTIONARII — Il giudizio del Pozionista\nLa corretta esecuzione di una formula è l’inizio della competenza, non la sua conclusione. Conoscere, preparare, utilizzare e giudicare sono livelli distinti. La preparazione corretta non attribuisce automaticamente competenze ulteriori o diritto d’uso.\nMANUALE DIDATTICO DI POZIONI\n36A","folio":"36A"},{"image":"pages/page-52.webp","text":"ARS POTIONUM\nAPPENDICE II · CONSULTAZIONE\nL’inventario degli ingredienti\nLe denominazioni seguono le schermate del gioco.\nIngrediente / contenitore\nSchede\nAcqua Distillata\n01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12, 13, 14, 15, 16,\n17\nAli di Cavalluccio\n16\nArtiglio di Drago\n11, 17\nAsfodelo\n14, 17\nAssenzio\n12, 14\nBelladonna\n13, 15\nBoccetta Vuota\n01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12, 13, 14, 15, 16,\n17\nBulbo di Scilla\n11\nCavolo Cinese Mordace\n02\nCentinodia\n08\nCipolla Puzzona\n06\nCorteccia di Cannella\n04, 11\nFico Grinzoso\n07\nFluxweed\n15\nFoglie di Dittamo\n01, 05, 10\nLeggere i rinvii\nI numeri indicano la scheda, non la pagina. Nome, pagina e anno della ricetta si trovano nel\nquadro iniziale. Le quantità specifiche restano riportate nella singola formula.\nAcqua Distillata e Boccetta Vuota compaiono in tutte le 17 preparazioni. La presenza in un inventario non autorizza\nl’uso in ricette vietate.\nMANUALE DIDATTICO DI POZIONI\n37","folio":"37"},{"image":"pages/page-53.webp","text":"ARS POTIONUM\nAPPENDICE II · CONSULTAZIONE\nL’inventario degli ingredienti\nSeconda parte. I numeri rinviano alle schede del ricettario.\nIngrediente / contenitore\nSchede\nLevistico\n14\nMalvadolce\n04, 17\nOcchi di Pesce Palla\n15\nPungiglione di Verme Cieco\n09\nRadice Amara\n08\nRadice di Zenzero\n02, 03\nRuta\n07\nScaglia di Drago\n09, 16\nSpine di Pesce Leone\n03, 12\nStarnutina\n06\nTentacoli di Murtlap\n01, 10\nTimo\n02\nUova di Doxy\n12\nUovo di Runespoor\n10, 16, 17\nVeleno di Ragno\n13\nMateriali simili non sono sostituibili\nScaglia e Artiglio di Drago sono voci differenti. Uovo di Runespoor e Uova di Doxy non sono\nequivalenti. Foglie di Dittamo ed Essenza di Dittamo designano rispettivamente un\ningrediente e un prodotto: non si sostituiscono.\nNomenclatura del gioco\nLe grafie del ricettario sono conservate per facilitare il confronto con l’inventario. Non si\nsostituisce Fluxweed con una traduzione ipotizzata né si unificano ingredienti sulla base di\nuna somiglianza narrativa.\nMANUALE DIDATTICO DI POZIONI\n38","folio":"38"},{"image":"pages/page-54.webp","text":"ARS POTIONUM\nAPPENDICE III · VERIFICA\nDomande di fine percorso\nLa prova pratica esclude sempre i preparati riservati alla teoria.\nPrimo e secondo anno\n1. Perché due unità di resa non richiedono il raddoppio degli ingredienti? 2. Quale azione\nsepara le due aggiunte di Dittamo nella Wiggenweld? 3. Quali ingredienti entrano prima del\nfuoco nella Pozione di Bellezza?\nTerzo e quarto anno\n4. Quante Foglie di Dittamo richiede l’essenza? 5. Gonfiante e Rimpicciolente sono\nautomaticamente antidoti reciproci? 6. Perché l’Antidoto Comune non può essere definito\nuniversale? 7. Dove si colloca la bacchetta nell’Edurus?\nQuinto anno\n8. In che cosa la Wiggenweld Concentrata differisce dalla formula base? 9. Ossofast e Maxima\ncambiano fiamma nella stessa direzione? 10. Una preparazione curativa riuscita autorizza\nqualsiasi impiego medimagico?\nSesto e settimo anno\n11. Il Veleno di Bottega può essere prodotto quando l’abilità supera 40? 12. Distillato della\nMorte Vivente e Pozione della Morte sono sinonimi? 13. Quali ingredienti precedono i due\ngesti magici del Distillato di Tempesta? 14. Quali sono le due attese della Felix Felicis?\nResponsabilità\n15. Elenca i quattro preparati esplicitamente vietati richiamati dal riferimento. 16. Che\ndifferenza c’è fra illegalità, restrizione ministeriale narrativa e divieto scolastico? 17. Che\ncosa dimostra un lucchetto associato a una soglia di abilità?\nCriteri di valutazione\nCompletezza della sequenza; correttezza di dosi e attese; distinzione fra fonte e deduzione;\nconoscenza dei limiti di impiego. Saper ammettere che un effetto o uno status non è\ndocumentato è parte della competenza richiesta.\nMANUALE DIDATTICO DI POZIONI\n39","folio":"39"},{"image":"pages/page-55.webp","text":"ARS POTIONUM\nAPPENDICE III · VERIFICA\nTraccia delle risposte\nPer il docente e per il ripasso autonomo.\nRisposte 1-5\n1. La resa è già prevista dalla formula: nello Stufato Vigoroso la singola dotazione produce\ndue unità. 2. Un mescolamento orario. 3. Acqua Distillata e due Malvadolce. 4. Quattro. 5.\nNo: le schermate non documentano una relazione di antidoto.\nRisposte 6-10\n6. Mancano le compatibilità con i singoli veleni. 7. Dopo il secondo mescolamento antiorario e\nprima dello spegnimento. 8. Cambiano dosi, Uovo di Runespoor, fasi di fuoco, verso del\nmescolamento e gesto magico. 9. No: Ossofast va da alto a basso; Maxima da basso ad alto.\n10. No: preparazione e competenza d’impiego sono distinte.\nRisposte 11-14\n11. No: il corso ne vieta la produzione a qualsiasi abilità. 12. No: la Pozione della Morte è una\nvoce distinta del repertorio illegale. 13. Scaglia di Drago e Uovo di Runespoor, nell’ordine.\n14. Prima 12-45 secondi; poi 5-20 secondi, nei punti prescritti dalla formula.\nRisposte 15-17\n15. Pozione dell’Amicizia, Bevanda della Disperazione, Pozione della Morte e Pozione della\nRigenerazione nella versione di Magia Oscura. 16. L’illegalità è attribuita dal riferimento; il\ncontrollo comporta restrizioni specifiche; il divieto scolastico esclude la produzione nel corso\nsenza inventare una legge del server. 17. Un requisito tecnico di accesso, non una prova\nd’illegalità.\nErrore che richiede un chiarimento immediato\nÈ insufficiente rispondere che una formula illegale diventa producibile “negli anni più alti”. In\nquesto manuale gli anni indicano il momento dello studio: i divieti di produzione restano\nvalidi per l’intero percorso.\n«Preferisco un limite riconosciuto a una certezza inventata.»\nMANUALE DIDATTICO DI POZIONI\n40","folio":"40"},{"image":"pages/page-56.webp","text":"ARS POTIONUM\nAPPENDICE IV · CONSULTAZIONE\nLessico essenziale\nParole da usare con precisione.\nVoce\nSignificato in questo volume\nAbilità minima\nSoglia “ab.” mostrata nel ricettario. Non coincide automaticamente con\nl’anno scolastico.\nAnno di conoscenza\nCollocazione didattica proposta per apprendere una formula e\ncomprenderne i limiti.\nResa\nNumero di unità di prodotto indicato accanto al nome. Non moltiplica\nautomaticamente le scorte.\nUnità\nUn oggetto o una porzione dell’inventario del gioco. Non corrisponde a\ngrammi o millilitri.\nFinestra d’attesa\nIntervallo espresso in secondi nella schermata. Viene conservato senza\nconversioni arbitrarie.\nMescolamento\nComando orientato in senso orario oppure antiorario; ogni occorrenza\nrimane distinta.\nAgitazione della bacchetta\nAzione magica autonoma, eseguita soltanto quando prescritta.\nEstrazione\nComando finale documentato nelle ricette, successivo all’aggiunta delle\nboccette.\nAntidoto\nPreparato destinato a contrastare determinati effetti; compatibilità da\nverificare.\nSolo teoria\nStudio consentito, produzione vietata. Non è uno sblocco rimandato a un\nanno successivo.\nIllegale nel riferimento\nStatus esplicitamente attribuito nel PDF allegato, distinto dal regolamento\nnon fornito del server.\nRestrizione d’uso\nDivieto riferito a certi contesti o destinatari, non necessariamente alla\nproduzione in assoluto.\nLa precisione del lessico permette di discutere una formula senza alterare le regole che la\nrendono riconoscibile. Ogni futura integrazione del server dovrà mantenere distinta la ricetta\ndalla sua interpretazione didattica.\nMANUALE DIDATTICO DI POZIONI\n41","folio":"41"},{"image":"pages/page-57.webp","text":"ARS POTIONUM\nAPPENDICE IV · CONSULTAZIONE\nGLOSSARIUM POTIONARIUM\nTavola complementare del lessico essenziale.\nFormula; Procedimento; Ingrediente; Contenitore; Fuoco basso; Fuoco alto; Intervallo; Mescolamento; Bacchetta; Estrazione; Autorizzazione; Applicazione.\nMANUALE DIDATTICO DI POZIONI\n41A","folio":"41A"},{"image":"pages/page-58.webp","text":"ARS POTIONUM\nFINIS\nLa conoscenza senza disciplina non è maestria. È soltanto un pericolo meglio informato.\nLucian Sharp\nHogwarts · MDCCC","folio":"42"},{"image":"pages/page-59.webp","text":"ARS POTIONUM\nPOST SCRIPTUM\nNOTA D’AUTORE\nDiritti d’autore, attribuzione e ringraziamenti.\n\nDiritti e attribuzione\nArs Potionum è un libro creato da Lucian Sharp AKA Razor per NightFall Roleplay, progetto presente su Hogwarts Legacy. L’idea del volume, la selezione e rielaborazione dei contenuti, l’impaginazione, la struttura didattica e questa edizione digitale appartengono all’autore nel contesto del progetto roleplay.\n\nLa presente opera nasce come supporto narrativo e didattico per l’esperienza di gioco e di interpretazione. Ogni utilizzo, adattamento o condivisione dovrebbe mantenere l’attribuzione a Lucian Sharp AKA Razor e il riferimento a NightFall Roleplay.\n\nRingraziamenti\nUn ringraziamento a chi ha dato voce, presenza e continuità a questo progetto: a chi legge, a chi studia, a chi interpreta, a chi ha scelto di vivere il laboratorio di Pozioni non come una semplice raccolta di ricette, ma come uno spazio di gioco, disciplina e immaginazione condivisa.\n\nGrazie in particolare alla comunità di NightFall Roleplay, agli studenti che hanno reso vivo ogni appunto di questo volume e a tutti coloro che, con curiosità e passione, hanno contribuito a trasformare una materia in un vero percorso di ruolo.\n\n«Ogni pagina di questo libro esiste perché qualcuno ha scelto di crederci, di leggerla e di portarla in vita.»\n\nLucian Sharp AKA Razor\nNightFall Roleplay · Hogwarts Legacy","folio":"Nota d’autore"},{"image":"pages/page-60.webp","text":"ARS POTIONUM\nPOST SCRIPTUM\nCOPYRIGHT & RISERVA AI/TDM\nTutela dell’edizione digitale e riserva d’uso automatizzato.\n\nCopyright e attribuzione\n© 2026 Lucian Sharp AKA Razor. Tutti i diritti sono riservati sugli elementi originali di Ars Potionum, inclusi i testi originali, la selezione e rielaborazione dei contenuti, la struttura didattica, l’impaginazione e il codice della presente edizione digitale, nel contesto del progetto NightFall Roleplay.\n\nRISERVA ESPRESSA AI / TEXT & DATA MINING\nÈ espressamente vietato, salvo preventiva autorizzazione scritta dell’autore, utilizzare questo volume, il relativo codice o i suoi contenuti per addestramento o fine-tuning di sistemi di intelligenza artificiale, creazione o arricchimento di dataset, text and data mining (TDM), estrazione massiva, embeddings, indicizzazione finalizzata all’apprendimento automatico o riproduzione automatizzata. La disponibilità pubblica online non costituisce licenza per tali usi.\n\nDiritti di terzi\nEventuali nomi, ambientazioni, marchi o riferimenti riconducibili a opere o videogiochi di terzi restano di proprietà dei rispettivi titolari. La presente dichiarazione riguarda gli elementi originali e la specifica realizzazione editoriale di questo progetto.\n\n\nRiproduzione, adattamento e riutilizzo: solo con attribuzione e previa autorizzazione dell’autore.\nMANUALE DIDATTICO DI POZIONI\n60","_ap_mark":"AP-P60-9A3F-BFEA","_ls_provenance":"LS-F60-4EE8-5249","_zwm":"⁠‌​‌​‌​​​‌‌​‌​‌​‌‌​‌​​‌​​‌‌‌‌​‌​‌​​‌​‌‌​​⁠","folio":"60"},{"image":"pages/page-61.jpg","text":"Controguardia posteriore marmorizzata.","folio":"Controguardia"},{"image":"pages/page-62.jpg","text":"Quarta di copertina. Ars Potionum. Lucian Sharp. Hogwarts · MDCCC.","folio":"Quarta di copertina"}],"chapters":[{"title":"Copertina","page":1},{"title":"Praefatio","page":2},{"title":"Tabula Materiarum","page":3},{"title":"Il percorso dei sette anni","page":4},{"title":"Fondamenti · Che cos’è una pozione?","page":5},{"title":"Ante Ignem","page":9},{"title":"Il Calderone","page":10},{"title":"Ars Ignis","page":11},{"title":"De Motu","page":12},{"title":"Tempus","page":13},{"title":"Errori del giovane pozionista","page":14},{"title":"Anno I · I fondamenti","page":15},{"title":"Anno II · Il governo del calore","page":19},{"title":"Anno III · Essenza e trasformazione","page":23},{"title":"Anno IV · Protezione e antidoti","page":28},{"title":"Anno V · Preparazioni composte","page":32},{"title":"Anno VI · Potenza e responsabilità","page":37},{"title":"De Licentia","page":39},{"title":"Anno VII · Disciplina avanzata","page":43},{"title":"Preparati proibiti","page":47},{"title":"Iudicium Potionarii","page":51},{"title":"Inventario degli ingredienti","page":52},{"title":"Verifica finale","page":54},{"title":"Lexicon Potionum","page":56},{"title":"Glossarium Potionarium","page":57},{"title":"Finis","page":58},{"title":"Copyright · Riserva AI/TDM","page":60},{"title":"Quarta di copertina","page":62}]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('book-data').textContent),count=data.pages.length;
const $=id=>document.getElementById(id);
const stage=$('stage'),book=$('book'),viewport=$('viewport'),shell=$('shell'),canvas=$('canvas');
$('pageInput').max=count;
const MOBILE_BREAKPOINT=900;
function safeGetSound(){try{return localStorage.getItem('ars-potionum-sound')!=='off'}catch(e){return true}}
function safeSetSound(v){try{localStorage.setItem('ars-potionum-sound',v?'on':'off')}catch(e){}}
let single=window.matchMedia(`(max-width:${MOBILE_BREAKPOINT}px)`).matches,current=0,busy=false,zoomed=false,
    soundOn=safeGetSound(),idleTimer=null,audioCtx=null,manualMode=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const isCompact=()=>window.matchMedia(`(max-width:${MOBILE_BREAKPOINT}px)`).matches||viewport.clientWidth<=MOBILE_BREAKPOINT;
const indexPair=n=>single?[-1,n]:n===0?[-1,0]:[n*2-1,n*2<count?n*2:-1];
const last=()=>single?count-1:Math.floor(count/2);
const currentPage=()=>single?current:current===0?0:current*2-1;
const preload=new Map();

function pageText(i){return i>=0&&i<count?(data.pages[i].text||''):''}
function pageKind(i){
  if(i<0||i>=count)return 'blank';
  const t=pageText(i),u=t.toUpperCase();
  if(i===0||i===count-1)return 'cover';
  if(u.includes('CONTROGUARDIA'))return 'endpaper';
  if(u.startsWith('PAGINA DI RISPETTO'))return 'respect';
  if(u.includes('\nANNO I\n')||u.includes('\nANNO II\n')||u.includes('\nANNO III\n')||u.includes('\nANNO IV\n')||u.includes('\nANNO V\n')||u.includes('\nANNO VI\n')||u.includes('\nANNO VII\n'))return 'divider';
  if(u.includes('RICETTARIO'))return 'recipe';
  if(u.includes('\nFINIS\n'))return 'finis';
  if(u.includes('APPENDICE'))return 'appendix';
  return 'theory';
}
function pageTitle(i){
  const lines=pageText(i).split('\n').map(x=>x.trim()).filter(Boolean);
  const generic=/^(ARS POTIONUM|ANNO \d+|ANNO [IVX]+|FONDAMENTI|APPENDICE|MANUALE|PAGINA DI RISPETTO)/i;
  return lines.find(x=>!generic.test(x))||`Pagina ${i+1}`;
}
function loadImage(i){
  if(i<0||i>=count)return Promise.resolve();
  if(preload.has(i))return preload.get(i);
  const promise=new Promise(resolve=>{const im=new Image();im.decoding='async';im.onload=resolve;im.onerror=resolve;im.src=data.pages[i].image});
  preload.set(i,promise);return promise
}
function imageAt(i){
  if(i<0||i>=count)return '';
  const alt=(pageTitle(i)+' · pagina '+(i+1)).replace(/"/g,'&quot;');
  return '<img draggable="false" decoding="async" alt="'+alt+'" src="'+data.pages[i].image+'">'
}
function setPage(el,i){
  el.innerHTML=imageAt(i);el.classList.toggle('blank',i<0||i>=count);el.dataset.kind=pageKind(i);el.dataset.page=String(i+1)
}
function classes(){
  stage.classList.toggle('single',single);stage.classList.toggle('cover',!single&&current===0);
  stage.classList.toggle('end',!single&&current===last()&&count%2===0);stage.classList.toggle('zoomed',zoomed);shell.classList.toggle('zoomed',zoomed)
}
function controls(){
  const[l,r]=indexPair(current),valid=[l,r].filter(i=>i>=0);
  $('status').textContent=valid.length===2?'Pagine '+(valid[0]+1)+'–'+(valid[1]+1)+' di '+count:'Pagina '+(valid[0]+1)+' di '+count;
  $('pageInput').value=valid[0]+1;
  $('prev').disabled=$('edgePrev').disabled=busy||current===0;$('next').disabled=$('edgeNext').disabled=busy||current===last();
  $('mode').disabled=busy||isCompact();$('zoom').disabled=busy;
  $('mode').textContent=single?'Due pagine':'Una pagina';$('zoom').textContent=zoomed?'Adatta':'Ingrandisci';
  $('zoom').setAttribute('aria-pressed',String(zoomed));$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'Suono':'Muto';
  $('reading').textContent=valid.map(i=>data.pages[i].text).join('\n\n');
  valid.forEach(i=>{loadImage(i);loadImage(i+1);loadImage(i+2);loadImage(i-1)})
}
function render(){classes();const[l,r]=indexPair(current);setPage($('left'),l);setPage($('right'),r);controls()}
function syncResponsiveMode(){
  const compact=isCompact();
  if(compact&&!single){const p=currentPage();single=true;current=p;render()}
  else if(!compact&&!manualMode&&single){const p=currentPage();single=false;current=p===0?0:Math.floor((p+1)/2);render()}
}
function resize(){
  syncResponsiveMode();stage.classList.toggle('zoomed',zoomed);shell.classList.toggle('zoomed',zoomed);
  const compact=isCompact(),ratio=595.276/841.89,pages=single?1:2,padX=compact?20:96,padY=compact?18:62;
  const availableW=Math.max(180,viewport.clientWidth-padX),availableH=Math.max(250,viewport.clientHeight-padY);
  const fittedPageW=Math.min(availableW/pages,availableH*ratio,760),fittedH=fittedPageW/ratio;
  const scale=zoomed?(compact?1.52:1.62):1,height=fittedH*scale,pageW=height*ratio,stageW=pageW*pages;
  stage.style.setProperty('--height',height+'px');stage.style.setProperty('--width',pageW+'px');
  canvas.style.width=zoomed?Math.max(viewport.clientWidth,stageW+(compact?34:120))+'px':'100%';
  canvas.style.minHeight=zoomed?Math.max(viewport.clientHeight,height+(compact?34:84))+'px':'100%';
  viewport.style.overflow=zoomed?'auto':'hidden'
}
function face(image,back=false){
  const d=document.createElement('div');d.className='face '+(back?'back':'front');d.dataset.kind=pageKind(image);d.innerHTML=imageAt(image);return d
}
function isHeavyTurn(indices){return indices.some(i=>pageKind(i)==='cover'||pageKind(i)==='endpaper')}
function isDividerTurn(indices){return indices.some(i=>pageKind(i)==='divider')}

function makeNoiseBuffer(duration){
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const len=Math.max(1,Math.floor(audioCtx.sampleRate*duration)),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),ch=buf.getChannelData(0);
  let smooth=0;for(let i=0;i<len;i++){const white=Math.random()*2-1;smooth=smooth*.82+white*.18;ch[i]=smooth*.78+white*.22}return buf
}
function rustleSound(heavy=false){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
    const duration=(heavy?.28:.21)+Math.random()*.035,src=audioCtx.createBufferSource(),high=audioCtx.createBiquadFilter(),low=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
    src.buffer=makeNoiseBuffer(duration);src.playbackRate.value=.95+Math.random()*.08;
    high.type='highpass';high.frequency.value=heavy?115:210;high.Q.value=.3;low.type='lowpass';low.frequency.value=heavy?1750:2450;low.Q.value=.4;
    const now=audioCtx.currentTime,peak=heavy?.22:.18;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(peak,now+.035);
    gain.gain.exponentialRampToValueAtTime(.06,now+duration*.62);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
    src.connect(high);high.connect(low);low.connect(gain);gain.connect(audioCtx.destination);src.start(now)
  }catch(e){}
}
function settleSound(heavy=false){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;
    osc.type='sine';osc.frequency.setValueAtTime(heavy?92:118,now);osc.frequency.exponentialRampToValueAtTime(heavy?70:88,now+.055);
    gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(heavy?.025:.015,now+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+.07);
    osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.075)
  }catch(e){}
}
/* Chromium fix: no CSS filter on the rotating 3D leaf; filters can flatten its two faces and reveal mirrored text. */
function turnFrames(forward,heavy=false){
  const s=forward?-1:1;
  if(heavy)return[
    {transform:'rotateY(0deg) translateZ(0) scaleX(1)',offset:0},
    {transform:`rotateY(${s*18}deg) translateZ(3px) scaleX(.999)`,offset:.18},
    {transform:`rotateY(${s*78}deg) translateZ(13px) scaleX(.992)`,offset:.48},
    {transform:`rotateY(${s*145}deg) translateZ(7px) scaleX(.997)`,offset:.82},
    {transform:`rotateY(${s*180}deg) translateZ(0) scaleX(1)`,offset:1}
  ];
  return[
    {transform:'rotateY(0deg) translateZ(0) scaleX(1) skewY(0deg)',offset:0},
    {transform:`rotateY(${s*20}deg) translateZ(4px) scaleX(.998) skewY(${s*.12}deg)`,offset:.14},
    {transform:`rotateY(${s*65}deg) translateZ(17px) scaleX(.985) skewY(${s*.38}deg)`,offset:.38},
    {transform:`rotateY(${s*103}deg) translateZ(25px) scaleX(.968) skewY(${s*.52}deg)`,offset:.56},
    {transform:`rotateY(${s*151}deg) translateZ(9px) scaleX(.991) skewY(${s*.22}deg)`,offset:.83},
    {transform:`rotateY(${s*180}deg) translateZ(0) scaleX(1) skewY(0deg)`,offset:1}
  ]
}
async function turnTo(target){
  target=Math.max(0,Math.min(last(),target));if(busy||target===current)return;
  busy=true;controls();
  const forward=target>current,[ol,or]=indexPair(current),[nl,nr]=indexPair(target),involved=[ol,or,nl,nr].filter(i=>i>=0);
  const heavy=isHeavyTurn(involved),divider=isDividerTurn(involved);rustleSound(heavy);
  await Promise.all([loadImage(nl),loadImage(nr)]);
  if(reduce.matches){current=target;busy=false;render();resize();settleSound(heavy);return}
  const leaf=document.createElement('div');leaf.className='leaf '+(forward?'forward':'backward');leaf.dataset.kind=heavy?'cover':divider?'divider':'paper';
  if(single){setPage($('right'),nr);leaf.append(face(or),face(nr,true))}
  else{
    if(forward){setPage($('left'),ol);setPage($('right'),nr);leaf.append(face(or),face(nl,true))}
    else{setPage($('left'),nl);setPage($('right'),or);leaf.append(face(ol),face(nr,true))}
    const was=current;current=target;classes();current=was
  }
  book.append(leaf);
  const duration=heavy?650:divider?580:500;
  const motion=leaf.animate(turnFrames(forward,heavy),{duration,easing:heavy?'cubic-bezier(.22,.58,.20,1)':'cubic-bezier(.18,.67,.18,1)',fill:'forwards'});
  try{await motion.finished}catch(e){}
  current=target;leaf.remove();busy=false;render();settleSound(heavy);wake()
}
const next=()=>turnTo(current+1),prev=()=>turnTo(current-1);
$('next').onclick=$('edgeNext').onclick=next;$('prev').onclick=$('edgePrev').onclick=prev;
function goPage(n){n=Math.max(0,Math.min(count-1,n));return turnTo(single?n:n===0?0:Math.floor((n+1)/2))}
$('jump').onsubmit=e=>{e.preventDefault();const n=Number($('pageInput').value);if(Number.isFinite(n))goPage(n-1)};
$('mode').onclick=()=>{if(busy||isCompact())return;const p=currentPage();manualMode=true;single=!single;current=single?p:p===0?0:Math.floor((p+1)/2);render();resize()};
$('zoom').onclick=()=>{zoomed=!zoomed;resize();controls();if(!zoomed)viewport.scrollTo({top:0,left:0});else viewport.scrollTo({top:0,left:Math.max(0,(canvas.scrollWidth-viewport.clientWidth)/2),behavior:'smooth'})};
$('sound').onclick=()=>{soundOn=!soundOn;safeSetSound(soundOn);controls();wake()};
$('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{$('full').title='Schermo intero non disponibile'}};
for(const chapter of data.chapters){const op=document.createElement('option');op.value=chapter.page;op.textContent=chapter.title;$('chapters').append(op)}
$('chapters').onchange=e=>{if(e.target.value!=='')goPage(Number(e.target.value)-1);e.target.value=''};
document.addEventListener('keydown',e=>{
  wake();if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  if(e.key==='Home'){e.preventDefault();turnTo(0)}if(e.key==='End'){e.preventDefault();turnTo(last())}
  if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey){$('full').click()}
});
let swipe=null;
book.addEventListener('touchstart',e=>{wake();const t=e.changedTouches[0];swipe={x:t.clientX,y:t.clientY}},{passive:true});
book.addEventListener('touchend',e=>{if(!swipe||zoomed){swipe=null;return;}const t=e.changedTouches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.3){dx<0?next():prev()}swipe=null},{passive:true});
function wake(){shell.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!shell.contains(document.activeElement)||document.activeElement===document.body)shell.classList.add('idle')},4500)}
['mousemove','mousedown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));
let resizeTimer=null;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,80)});document.addEventListener('fullscreenchange',resize);
render();resize();wake();loadImage(0).then(()=>$('loading').hidden=true);
</script><script src="reader-refinements.js?v=20261101"></script></body></html>

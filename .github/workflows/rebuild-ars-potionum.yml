name: Rebuild Ars Potionum book
on:
  push:
    paths:
      - '.github/workflows/rebuild-ars-potionum.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild book content
        shell: bash
        run: |
          set -euo pipefail
          cat .ars_potionum_update/part-* > viewer/book-content.html
          test "$(wc -c < viewer/book-content.html)" -eq 6438930
          rm -rf .ars_potionum_update
          rm -f .github/workflows/rebuild-ars-potionum.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiorna pagine Ars Potionum senza modificare suoni"
          git push
